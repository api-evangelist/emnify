openapi: 3.2.0
info:
  title: Enterprise Tariff Profiles API
  version: 1.0.0
  description: Profiles for tariffs and their configuration
servers:
- url: https://cdn.emnify.net
  description: emnify REST API
tags:
- name: tariffProfiles
  description: Profiles for tariffs and their configuration
paths:
  /api/v1/tariff_profile:
    get:
      operationId: tariffProfiles_TariffProfileGet
      summary: List tariff profiles
      description: 'Required permissions Beta Learn more


        `TariffProfile` + `List`


        Roles: Administrator User Observer


        Returns the list of tariff profiles of the user''s own organisation.'
      tags:
      - tariffProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1TariffProfileGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileGetRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: tariffProfiles_TariffProfilePost
      summary: Create tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile` + `Create`


        Roles: Administrator User


        Create the specified tariff profile

        ID must not be specified, neither in query String, nor in JSON payload.

        You can provide following fields with this request:


        * `name` (String required)

        * `description` (String optional)

        * `tariff` (Object required)'
      tags:
      - tariffProfiles
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff_profiles_TariffProfilePost_Response_201'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfilePostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                tariff:
                  $ref: '#/components/schemas/ApiV1TariffProfilePostRequestBodyContentApplicationJsonSchemaTariff'
              required:
              - name
              - description
              - tariff
      security:
      - bearerAuth: []
  /api/v1/tariff_profile/{tariff_profile_id}:
    get:
      operationId: tariffProfiles_TariffProfileByIdGet
      summary: Tariff profile details
      description: 'Required permissions Beta Learn more


        `TariffProfile` + `Get`


        Roles: Administrator User Observer


        Returns tariff profile specified by id. This tariff profile also contains information about the currently valid ratezones of the tariff in the tariff profile and if the ratezone is selected in the tariff profile.

        It also contains applied custom rates for the included tariffs.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: The numeric ID of a Tariff Profile
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff_profiles_TariffProfileByIdGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileByIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
    delete:
      operationId: tariffProfiles_TariffProfileByIdDelete
      summary: Delete tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile` + `Delete`


        Roles: Administrator User


        Deletes tariff profile. Tariff profiles used by an endpoint (`used_count` > 0) cannot be deleted.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: The numeric ID of a Tariff Profile
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileByIdDeleteRequestForbiddenError'
      security:
      - bearerAuth: []
    patch:
      operationId: tariffProfiles_TariffProfileByIdPatch
      summary: Update tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile` + `Update`


        Roles: Administrator User


        Patch the specified tariff profile.


        The API doesn''t provide feedback if you assign an incompatible tariff profile to a SIM.

        See Tariff profile for more information.


        You can provide following fields with this request:


        * `name` (String optional)

        * `description` (String optional)

        * `tariff` (Object optional) If the tariff is changed, all selections of ratezones are removed.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: The numeric ID of a Tariff Profile
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileByIdPatchRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                tariff:
                  $ref: '#/components/schemas/ApiV1TariffProfileTariffProfileIdPatchRequestBodyContentApplicationJsonSchemaTariff'
              required:
              - name
              - description
              - tariff
      security:
      - bearerAuth: []
  /api/v1/tariff_profile/{tariff_profile_id}/ratezone_selection/{ratezone_id}:
    put:
      operationId: tariffProfiles_TariffProfileRatezoneSelectionByTpIdAndRzIdPut
      summary: Assign ratezone to tarriff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.RatezoneSelection` + `Add`


        Roles: Administrator User


        Only currently valid and active ratezones can be selected for a tariff profile'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: ratezone_id
        in: path
        description: ratezone ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileRatezoneSelectionByTpIdAndRzIdPutRequestForbiddenError'
      security:
      - bearerAuth: []
    delete:
      operationId: tariffProfiles_TariffProfileRatezoneSelectionByTpIdAndRzIdDelete
      summary: Delete ratezone from tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.RatezoneSelection` + `Remove`


        Roles: Administrator User


        Remove previously selected ratezones from a tariff profile'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: ratezone_id
        in: path
        description: ratezone ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileRatezoneSelectionByTpIdAndRzIdDeleteRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v2/tariff_profile/{tariff_profile_id}/operator_blocklist/operator:
    get:
      operationId: tariffProfiles_TariffProfileOperatorBlockListOperatorGet
      summary: Get the operator blocklist for a specific tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator` + `List`


        Roles: Administrator User Observer


        Retrieve blocklist details for operators within a specific tariff profile'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Successfully retrieved the operator blocklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff_profiles_TariffProfileOperatorBlockListOperatorGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockListOperatorGetRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v2/tariff_profile/{tariff_profile_id}/operator_blocklist/operator/{operator_id}:
    get:
      operationId: tariffProfiles_TariffProfileOperatorBlockOperatorByIDGet
      summary: Get operator blocklist for a specific tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator` + `Get`


        Roles: Administrator User Observer


        Retrieve blocklist details for an operator within a specific tariff profile'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: operator_id
        in: path
        description: operator ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Successfully retrieved operator blocklist details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff_profiles_TariffProfileOperatorBlockOperatorByIDGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockOperatorByIDGetRequestForbiddenError'
      security:
      - bearerAuth: []
    put:
      operationId: tariffProfiles_TariffProfileOperatorBlockOperatorByIDPut
      summary: Block the operator completely for a given tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator` + `Add`


        Roles: Administrator User


        Block the operator completely.

        If there are already specific RAT types blocklisted, those entries **aren''t** overridden.


        You don''t need a request body for this operation.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: operator_id
        in: path
        description: operator ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: No Content. The operator has been successfully blocklisted.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockOperatorByIDPutRequestForbiddenError'
      security:
      - bearerAuth: []
    delete:
      operationId: tariffProfiles_TariffProfileOperatorBlockOperatorByIDDelete
      summary: Remove an operator from the blocklist
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator` + `Remove`


        Roles: Administrator User


        Removes a specific operator from the blocklist of a given tariff profile.

        If there are already specific RAT types blocklisted, the entries will NOT be overridden.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: operator_id
        in: path
        description: operator ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: No Content - Operator successfully removed from the blocklist
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockOperatorByIDDeleteRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v2/tariff_profile/{tariff_profile_id}/operator_blocklist/operator/{operator_id}/rat_type:
    post:
      operationId: tariffProfiles_TariffProfileOperatorBlockOperatorByIDRatTypePost
      summary: Block specific RAT types
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator.RatType` + `Add`


        Roles: Administrator User


        Add a specific operator to the blocklist of a given tariff profile.

        If the operator is already blocked completely, it is still possible to block specific RAT types.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: operator_id
        in: path
        description: operator ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: No Content - The specific RAT types have been successfully blocked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockOperatorByIDRatTypePostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rat_types:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorOperatorIdRatTypePostRequestBodyContentApplicationJsonSchemaRatTypesItems'
              required:
              - rat_types
      security:
      - bearerAuth: []
  /api/v2/tariff_profile/{tariff_profile_id}/operator_blocklist/operator/{operator_id}/rat_type/{rate_type_id}:
    delete:
      operationId: tariffProfiles_TariffProfileOperatorBlockOperatorByIDRatTypeByIDDelete
      summary: Unblock a specific RAT type
      description: 'Required permissions Beta Learn more


        `TariffProfile.OperatorBlocklist.Operator.RatType` + `Remove`


        Roles: Administrator User


        Unblock a specific RAT type for an operator within a tariff profile.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      - name: operator_id
        in: path
        description: operator ID
        required: true
        schema:
          type: number
          format: double
      - name: rate_type_id
        in: path
        description: rate_type ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: No Content - The specific RAT type has been successfully unblocked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileOperatorBlockOperatorByIDRatTypeByIDDeleteRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v1/tariff_profile/{tariff_profile_id}/coverage:
    get:
      operationId: tariffProfiles_TariffProfileCoverageByTpIdGet
      summary: List tariff profile coverage
      description: 'Required permissions Beta Learn more


        `TariffProfile.Coverage` + `List`


        Roles: Administrator User Observer


        Provides the list of countries where that tariff profile can be used.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: tariff profile ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1TariffProfileTariffProfileIdCoverageGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileCoverageByTpIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v1/tariff_profile/{tariff_profile_id}/inclusive_volume/{inclusive_volume_id}:
    put:
      operationId: tariffProfiles_TariffProfileInclusiveVolumeAssignment
      summary: Assign inclusive volume to tarriff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.InclusiveVolume` + `Add`


        Roles: Administrator User


        Assignes an inclusive volume to the selected tariff profile.

        If no inclusive volume is assigned and the customer has multiple active inclusive volumes, the traffic for this tariff profile will be rated as "Pay As You Go".


        The selected inclusive volume must not be expired and the tariff profile should not have an inclusive volume assigned yet.

        The tariff of the tariff profile and the inclusive volume ratezone have to match.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: Tariff Profile ID
        required: true
        schema:
          type: number
          format: double
      - name: inclusive_volume_id
        in: path
        description: Inclusive Volume ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: The inclusive volume is expired or tariff does not match
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileInclusiveVolumeAssignmentRequestForbiddenError'
        '404':
          description: Tariff profile or inclusive volume not found
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: Tariff profile already has an inclusive volume assigned
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    delete:
      operationId: tariffProfiles_TariffProfileInclusiveVolumeRemoveAssignment
      summary: Unassign inclusive volume from tariff profile
      description: 'Required permissions Beta Learn more


        `TariffProfile.InclusiveVolume` + `Remove`


        Roles: Administrator User


        Unassign the inclusive volume from the selected tariff profile. If the customer has multiple active inclusive volume, the traffic within that tariff profile

        will be rated as "Pay As You Go" afterwards.'
      tags:
      - tariffProfiles
      parameters:
      - name: tariff_profile_id
        in: path
        description: Tariff Profile ID
        required: true
        schema:
          type: number
          format: double
      - name: inclusive_volume_id
        in: path
        description: Inclusive Volume ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: The server has successfully fulfilled the request and that there is no additional content to send in the response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: The inclusive volume is not assigned to the selected tariff profile
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffProfileInclusiveVolumeRemoveAssignmentRequestForbiddenError'
        '404':
          description: Tariff profile or inclusive volume not found
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
components:
  schemas:
    Tariff_profiles_TariffProfilePost_Response_201:
      type: object
      properties: {}
      description: Empty response body
      title: Tariff profiles_TariffProfilePost_Response_201
    ApiV1TariffProfileTariffProfileIdGetResponsesContentApplicationJsonSchemaTariffCurrency:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ApiV1TariffProfileTariffProfileIdGetResponsesContentApplicationJsonSchemaTariffCurrencyId'
        code:
          type: string
        symbol:
          type: string
      title: ApiV1TariffProfileTariffProfileIdGetResponsesContentApplicationJsonSchemaTariffCurrency
    TariffProfileInclusiveVolumeRemoveAssignmentRequestForbiddenError:
      type: object
      properties:
        error_code:
          type: integer
        error_token:
          type: string
        status_code:
          type: integer
        message:
          type: string
      title: TariffProfileInclusiveVolumeRemoveAssignmentRequestForbiddenError
    ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorOperatorIdGetResponsesContentApplicationJsonSchemaOperator:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      title: ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorOperatorIdGetResponsesContentApplicationJsonSchemaOperator
    TariffProfileByIdDeleteRequestForbiddenError:
      type: object
      properties:
        error_code:
          type: integer
        error_token:
          type: string
        status_code:
          type: integer
        message:
          type: string
      title: TariffProfileByIdDeleteRequestForbiddenError
    ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorGetResponsesContentApplicationJsonSchemaBlocklist:
      type: object
      properties:
        operator:
          type: boolean
          description: Will return true if the operator is blocked completely
        rat_types:
          type: array
          items:
            $ref: '#/components/schemas/ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorGetResponsesContentApplicationJsonSchemaBlocklistRatTypesItems'
      title: ApiV2TariffProfileTariffProfileIdOperatorBlocklistOperatorGetResponsesContentApplicationJsonSchemaBlocklist
    TariffProfileGetRequestForbiddenError:
      type: object
      properties:
        error_code:
          type: integer
        error_token:
          type: string
        status_code:
          type: integer
        message:
          type: string
      title: TariffProfileGetRequestForbiddenError
    ApiV1TariffProfileGetResponsesContentApplicationJsonSchemaItems:
      type: object
      properties:
        id:
          type: number
          format: double
        name:
          type: string
        description:
          type: string
        used_count:
          type: string
        organisation_id:
          type: string
        tariff:
          $ref: '#/components/schemas/ApiV1TariffProfileGetResponsesContentApplicationJsonSchemaItemsTariff'
        inclusive_volume:
          $ref: '#/components/schemas/ApiV1TariffProfileGetResponsesContentApplicationJsonSchemaItemsInclusiveVolume'
          description: If there is an inclusive volume assigned to the tariff profile, the details will be returned within this object
      title: ApiV1TariffProfileGetResponsesContentApplicationJsonSchemaItems
    TariffProfileOperatorBlockOperatorByIDDeleteRequestForbiddenError:
      type: object
      properties:
        error_code:
          type: integer
        error_token:
          type: string
        status_code:
          type: integer
