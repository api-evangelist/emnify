        </Info>

        Retrieve the daily stats for your Workspaces.

        <Note>
          Historical data is available for up to **13 months**.
        </Note>
      tags:
        - workspaces
      parameters:
        - name: start_date
          in: query
          description: |
            Filters by start date, provided in a `YYYY-MM-DD` format.

            <Info>
              If you don't define an end date, the response will include 6 months of data, beginning on the current date.
            </Info>
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: |
            Filters by end date, provided in an `YYYY-MM-DD` format.

            <Info>
              If you don't define a start date, the response will only return data from the month indicated in your end date.
            </Info>
          required: false
          schema:
            type: string
            format: date
        - name: workspace_ids
          in: query
          description: |
            Comma separated list of workspace IDs to filter the results for.
            If not provided, the response will include all Workspaces you have access to.
          required: false
          schema:
            type: string
            pattern: (\d+,?)+
      responses:
        '200':
          description: Successfully retrieved the daily Workspace stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspaces_GetWorkspaceDailyStats_Response_200'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkspaceDailyStatsRequestForbiddenError'
        '422':
          description: Requested Workspaces not found or not accessible
          content:
            application/json:
              schema:
                description: Any type
      security:
        - bearerAuth: []
