        '403':
          description: Caller lacks permission or the feature is not enabled for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsDetailRequestForbiddenError'
        '404':
          description: Endpoint with ID <number> not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsDetailRequestNotFoundError'
