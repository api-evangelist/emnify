    ServiceProfileDeviceToDeviceMode:
      type: string
      enum:
        - disabled
        - enabled
        - forward_to_backend
      description: >
        Device-to-device mode of the service profile:


        - `disabled` (default): Traffic between devices is dropped.

        - `enabled`: Traffic is delivered directly between devices, as long as the service profiles of both devices have
        device-to-device enabled.

        - `forward_to_backend`: Traffic between devices is routed through your Cloud Connect backend, for example so
        your own firewall can inspect it.
      title: ServiceProfileDeviceToDeviceMode
    ServiceProfileDeviceToDevice:
      type: object
      properties:
        service_profile_id:
          type: integer
          description: ID of the service profile.
        mode:
          $ref: '#/components/schemas/ServiceProfileDeviceToDeviceMode'
          description: >
            Device-to-device mode of the service profile:


            - `disabled` (default): Traffic between devices is dropped.

            - `enabled`: Traffic is delivered directly between devices, as long as the service profiles of both devices
            have device-to-device enabled.

            - `forward_to_backend`: Traffic between devices is routed through your Cloud Connect backend, for example so
            your own firewall can inspect it.
        modified_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the mode was last changed.
            `null` if device-to-device has never been configured on the service profile.
        warnings:
          type: array
          items:
            type: string
          description: >
            Advisory messages about the configuration.

            Only present in `PUT` responses, and only when there's something to report, for example after setting
            `forward_to_backend`.
      required:
        - service_profile_id
        - mode
        - modified_at
