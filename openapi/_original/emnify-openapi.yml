  /api/v1/cnc/breakout/vpn:
    post:
      operationId: cloudConnect_CreateCloudConnectAttachmentVPN
      summary: Create a Cloud Connect attachment via IPSec VPN
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `CloudConnect.Breakout.Vpn` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Creates a Cloud Connect attachment via a specified VPN server.

        Currently two attachment types are available:


        - **Static VPN** (type `2`): Basic IPSec VPN connection

        - **Dynamic VPN with BGP** (type `3`): IPSec VPN with BGP routing.
          Requires `asn` (Autonomous System Number), otherwise dynamic routing is disabled.
          Optionally accepts `inside_cidr` for BGP tunnel interfaces.

        The `on_prem_cidr` parameter specifies the CIDR ranges of your backend network (up to 3).

        The `public_ip` is the public IP address of your VPN server.


        A `psk` (Pre-Shared Key) can be configured with 8-64 alphanumeric characters, periods (`.`), and underscores
        (`_`).

        It must not begin with `0`.

        If left empty, it generates automatically and can be retrieved via [`GET
        /api/v1/cnc/breakout/{cloudconnect_attachment_id}`](/developers/api/cloud-connect/get-cloud-connect-attachment-by-id).


        <Success>
          The created connection is available within 3-5 minutes.
        </Success>
      tags:
        - cloudConnect
      responses:
        '201':
          description: |
            Attachment created successfully.
            The `Location` header contains the URL of the new resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cloud_Connect_CreateCloudConnectAttachmentVPN_Response_201'
        '400':
          description: |
            The request body is malformed or missing required fields.
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your authentication token is valid, but you don't have permission to access the requested resource.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/ApiV1CncBreakoutVpnPostRequestBodyContentApplicationJsonSchemaType'
                  description: |
                    Breakout type.
                    Use `2` for Static VPN or `3` for Dynamic VPN with BGP.
                name:
                  type: string
                  description: Display name for the Cloud Connect attachment.
                description:
                  type: string
                  description: Optional description for the attachment.
                region:
                  type: string
                  description: AWS region for the attachment (for example, `eu-west-1`).
                public_ip:
                  type: string
                  description: Public IP address of your VPN server.
                psk:
                  type: string
                  description: |
                    Pre-shared key (PSK) for the VPN connection.
                    If empty, AWS generates one automatically.
                asn:
                  type: integer
                  description: |
                    Autonomous System Number (ASN) for BGP routing.

                    <Info>
                      Required for Dynamic VPN (type `3`)."
                    </Info>
                on_prem_cidr:
                  type: array
                  items:
                    type: string
                  description: |
                    CIDR ranges of your backend network.
                    You can configure up to 3 ranges.
                inside_cidr:
                  type: array
                  items:
                    type: string
                  description: |
                    For Dynamic VPN only: /30 CIDR ranges for BGP tunnel interfaces (up to 3).
                    If empty, AWS generates them automatically.
              required:
                - type
                - name
                - public_ip
                - on_prem_cidr
      security:
        - bearerAuth: []
