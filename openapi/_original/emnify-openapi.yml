          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.Role` + `Get`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>

        Returns a single role with its full permission list.
        Works for both system and custom roles.

        Use `my` in place of a numeric `orgId` to target the caller's own Workspace.
      tags:
        - permissionAndRoleManagement
      parameters:
        - name: roleId
          in: path
          description: Numeric identifier of the role.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: orgId
          in: path
          description: |
            Workspace identifier.
            Either a positive integer organization ID, or the literal string `my` to target the caller's own Workspace.
          required: true
          schema:
            $ref: '#/components/schemas/ApiV1OrganisationOrgIdRoleRoleIdGetParametersOrgId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithPermissionsOutputDto'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganisationRoleRequestNotFoundError'
      security:
        - bearerAuth: []
    delete:
      operationId: permissionAndRoleManagement_deleteCustomRole
      summary: Delete a custom role
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.Role` + `Delete`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Deletes a custom role.
        The request fails if the role is a system role, or if any users are still assigned to it.

        Use `my` in place of a numeric `orgId` to target the caller's own Workspace.
      tags:
        - permissionAndRoleManagement
      parameters:
        - name: roleId
          in: path
          description: Numeric identifier of the role.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: orgId
          in: path
          description: |
            Workspace identifier.
            Either a positive integer organization ID, or the literal string `my` to target the caller's own Workspace.
          required: true
          schema:
            $ref: '#/components/schemas/ApiV1OrganisationOrgIdRoleRoleIdDeleteParametersOrgId'
      responses:
        '204':
          description: Role deleted.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCustomRoleRequestNotFoundError'
        '422':
          description: |
            Business rule violation.
            Either the role is a system role, or users are still assigned to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCustomRoleRequestUnprocessableEntityError'
      security:
        - bearerAuth: []
    patch:
      operationId: permissionAndRoleManagement_updateCustomRole
      summary: Update a custom role
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.Role` + `Update`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Partially updates a custom role.
        System roles can't be modified.

        When you provide `permission_ids` or `permissions`, the field replaces the existing permission list.
        The two fields are mutually exclusive.
        Retrieve the valid permissions with `GET /api/v1/organisation/{orgId}/permission`.

        Use `my` in place of a numeric `orgId` to target the caller's own Workspace.
      tags:
        - permissionAndRoleManagement
      parameters:
        - name: roleId
          in: path
          description: Numeric identifier of the role.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: orgId
          in: path
          description: |
            Workspace identifier.
            Either a positive integer organization ID, or the literal string `my` to target the caller's own Workspace.
          required: true
          schema:
            $ref: '#/components/schemas/ApiV1OrganisationOrgIdRoleRoleIdPatchParametersOrgId'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithPermissionsOutputDto'
        '400':
          description: >
            Validation error.

            For example, an invalid name or description, or a referenced permission that isn't available to the
            Workspace's organization type.

            Supplying both `permission_ids` and `permissions` in the same request is also rejected, because the two
            fields are mutually exclusive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomRoleRequestBadRequestError'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomRoleRequestNotFoundError'
        '409':
          description: A role with this name already exists in the Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomRoleRequestConflictError'
        '422':
          description: >
            Business rule violation.

            For example, an attempt to modify a system role, or `permission_ids` or `permissions` references a
            permission that is unknown, deprecated, deleted, or granted globally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomRoleRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomRoleInputDto'
      security:
        - bearerAuth: []
  /api/v1/user/my/permission:
    get:
      operationId: permissionAndRoleManagement_getUserPermissions
      summary: List your permissions in the current Workspace
      description: >
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          No permission required. Available to all roles.
        </Info>


        Returns a flattened list of permissions across all user roles assigned to the calling user in the current
        Workspace.
      tags:
        - permissionAndRoleManagement
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionOutputDto'
        '401':
          description: |
            The request has no valid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserPermissionsRequestUnauthorizedError'
        '403':
          description: |
            The caller's roles don't include the permission needed to read this list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserPermissionsRequestForbiddenError'
      security:
        - bearerAuth: []
