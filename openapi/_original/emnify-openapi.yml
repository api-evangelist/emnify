  /api/v1/endpoint:
    get:
      operationId: endpoint_GetEndpoints
      summary: List endpoints
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Retrieves all endpoints for your organization.
        Use the query parameters to filter, sort, and paginate results.
      tags:
        - endpoint
      parameters:
        - name: q
          in: query
          description: >
            Filters endpoints by field value.

            Use `<field>:<criteria>` format.

            Combine multiple filters with commas (for example, `status:0,tags:sensor`).


            `connectivity_status` accepts only the value `BLOCKED`, which returns the endpoints that are currently
            denied service (for example, after exceeding a traffic limit).

            It takes a single value, so wildcards and `||` lists aren't supported.
          required: false
          schema:
            type: string
            pattern: >-
              (status|service_profile|tariff_profile|id|name|created|last_updated|tags|ip_address|imei|iccid|iccid_with_luhn|eid|sim_status|connectivity_status):.+
        - name: sort
          in: query
          description: |
            Sorts endpoints by field value.
            Use `<operator><field>` format.
            Combine multiple sort fields with commas (for example, `-status,id`).

            **Operators:**
            - `-` descending (Z-A for text, highest number first)
            - `+` ascending (A-Z for text, lowest number first)

            Defaults to ascending order if no operator is specified.
            Defaults to `id` if no sort field is specified.
            Endpoints with identical values are sorted by ascending `id`.
          required: false
          schema:
            type: string
            pattern: (^-?(id|name|status|last_updated|created|tags|ip_address|imei|eid|service_profile|tariff_profile)),?
        - name: page
          in: query
          description: |
            Page number to retrieve.
            Starts at 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of endpoints to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: |
            Returns an array of endpoint objects.
            Pagination metadata is included in the response headers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEndpointsRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: endpoint_CreateEndpoint
      summary: Create an endpoint
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint` + `Create` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-create "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>

        Creates a single endpoint with the specified configuration.

        <Note>
          For bulk operations, use [`POST /api/v2/endpoint/multi`](/developers/api/endpoint/bulk-create-endpoint) instead (supports up to 2,000 endpoints per request).
        </Note>

        <Warning>
          emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.
        </Warning>
      tags:
        - endpoint
      responses:
        '201':
          description: Endpoint created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_CreateEndpoint_Response_201'
        '400':
          description: |
            Request body is malformed.
            Check JSON syntax.
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEndpointRequestForbiddenError'
        '404':
          description: |
            IP address space is full, in use for creating another endpoint or the resource wasn't found.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: |
            Validation failed.
            Possible causes:

            - Invalid service profile, tariff profile, or status ID
            - Invalid IP address space or organization ID
            - Endpoint data is invalid
            - Organization doesn't belong to your reseller
            - Both `tags` and `tag_assignments` were provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the endpoint.
                tags:
                  type: string
                  description: |
                    Comma-separated list of tags (for example, `sensor,outdoor`).
                    Tags that do not exist yet are created.

                    <Warning>
                      Deprecated. Use `tag_assignments` instead.
                    </Warning>
                  deprecated: true
                tag_assignments:
                  type: array
                  items:
                    type: integer
                  description: |
                    IDs of existing tags to assign to the endpoint.
                    Unlike `tags`, tags are not created automatically, so every ID must already exist.

                    <Info>
                      Mutually exclusive with `tags`. Provide at most one of the two.
                    </Info>
                imei:
                  type: string
                  description: International Mobile Equipment Identity with Software Version Number (IMEISV) (16 digits).
                imei_lock:
                  type: boolean
                  default: false
                  description: If `true`, this endpoint only allows connections from the device with the specified IMEI.
                sim:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaSim'
                  description: |
                    SIM card to assign to this endpoint.
                    If omitted, no SIM is assigned.
                ip_address:
                  type: string
                  description: |
                    Private IP address to assign.

                    <Info>
                      If provided, you must also specify `ip_address_space`.
                    </Info>
                service_profile:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaServiceProfile'
                  description: |
                    Service profile that determines network access settings.
                    Must belong to your organization.
                tariff_profile:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaTariffProfile'
                  description: |
                    Tariff profile that determines pricing and data limits.
                    Must belong to your organization.
                status:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: Initial endpoint status.
                organisation:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaOrganisation'
                  description: |
                    Organization to create the endpoint in.
                    Required only for reseller accounts creating endpoints in sub-organizations.
                ip_address_space:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaIpAddressSpace'
                  description: |
                    IP address space for the endpoint.

                    <Info>
                      Required if `ip_address` is provided.
                    </Info>
              required:
                - service_profile
                - tariff_profile
                - status
      security:
        - bearerAuth: []
  /api/v2/endpoint/multi:
    post:
      operationId: endpoint_BulkCreateEndpoint
      summary: Bulk create endpoints
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint` + `Create` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-create "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Create up to 2,000 endpoints in one request.


        Unlike [`POST /api/v1/endpoint`](/developers/api/endpoint/create-endpoint), this bulk endpoint handles multiple
        endpoints safely in a single request without sequential execution constraints between individual endpoints.


        <Note>
          Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.
        </Note>


        If a `sim` object is provided, the specified SIM is assigned to the endpoint and is activated by default.

        To assign the SIM without activating it, explicitly set the `activate` property to `false`; omitting it
        activates the SIM.


        When the SIM is activated:

        - The SIM enters Factory Test Mode (FTM) if FTM is enabled for the organization.

        - Otherwise, it goes directly to **Activated**.


        To override this behavior and explicitly set the SIM's status (for example, skip FTM even if it's enabled for
        your organization), include a `status` object within the `sim` object.


        <Warning>
          emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.
        </Warning>
      tags:
        - endpoint
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostResponsesContentApplicationJsonSchemaItems'
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            User doesn't have permission to bulk create endpoints
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: IP address space is full
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: |
            Appears in one of the following cases:

            - Service profile is invalid
            - Tariff profile is invalid
            - Status is invalid
            - IP address space is invalid
            - Organization is invalid
            - Endpoints are invalid
            - Both `tags` and `tag_assignments` were provided for an endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_profile:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaServiceProfile'
                  description: |
                    Applies to all endpoints.
                tariff_profile:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaTariffProfile'
                  description: |
                    Applies to all endpoints.
                status:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: |
                    Applies to all endpoints.
                organisation:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaOrganisation'
                  description: |
                    If provided, it must include a valid `id` (cannot be empty).
                ip_address_space:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaIpAddressSpace'
                  description: |
                    Required if any endpoint in the `endpoints` array has an `ip_address`.
                endpoints:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaEndpointsItems'
              required:
                - service_profile
                - tariff_profile
                - status
                - endpoints
      security:
        - bearerAuth: []
    delete:
      operationId: endpoint_BulkDeleteEndpoint
      summary: Bulk delete endpoints
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint` + `Delete` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-delete "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Deletes a list of endpoints in bulk, along with all child entities.


        Unlike [`DELETE /api/v1/endpoint/{endpoint_id}`](/developers/api/endpoint/endpoint-by-id-delete), this bulk
        endpoint handles multiple endpoints safely in a single request without sequential execution constraints between
        individual endpoints.


        <Note>
          Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.
        </Note>


        If a SIM is assigned to one of the endpoints, it's released and suspended.

        If the `delete_sims` query parameter is set to `true`, the SIMs are also deleted.
      tags:
        - endpoint
      parameters:
        - name: delete_sims
          in: query
          description: |
            If `true`, the SIMs will be deleted along with the endpoints.
            If `false`, the SIMs will only be suspended.
            Defaults to `false`.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Endpoints deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            User doesn't have permission to bulk delete endpoints
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: |
            Requested endpoint ID isn't found
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV2EndpointMultiDeleteRequestBodyContentApplicationJsonSchemaItems'
      security:
        - bearerAuth: []
    patch:
      operationId: endpoint_BulkUpdateEndpoint
      summary: Bulk update endpoints
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint` + `Update` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-update "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Updates details of a list of endpoints in bulk.


        The request body must be an array of endpoint objects.

        Each object requires an `id` field to identify the endpoint, and you only need to include the fields you want to
        update.


        Unlike [`PATCH /api/v1/endpoint/{endpoint_id}`](/developers/api/endpoint/endpoint-by-id-patch), this bulk
        endpoint handles multiple endpoints safely in a single request without sequential execution constraints between
        individual endpoints.


        <Note>
          Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.
        </Note>


        <Warning>
          emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.
          To avoid accruing unexpected charges, update the SIM status to **Suspended** (`"id": 2`).
        </Warning>
      tags:
        - endpoint
      responses:
        '204':
          description: Endpoints updated successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            User doesn't have permission to bulk update endpoints
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: |
            Appears in one of the following cases:

            - IP address space isn't found
            - IP address space is full
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: |
            Appears in one of the following cases:

            - Service profile is invalid
            - Tariff profile is invalid
            - Status is invalid
            - IP address space is invalid
            - IP address is invalid
            - SIM is invalid
            - Both `tags` and `tag_assignments` were provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV2EndpointMultiPatchRequestBodyContentApplicationJsonSchemaItems'
      security:
        - bearerAuth: []
