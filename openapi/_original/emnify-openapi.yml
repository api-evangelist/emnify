        </Info>

        Returns a list of SIMs filtered, sorted, and paged according to query parameters.
      tags:
        - sim
      parameters:
        - name: q
          in: query
          description: |
            Filter parameter in `<field>:<criteria>` format.
            Expects a comma-separated list from the allowed fields:

            * `id`
            * `issuer_org`
            * `reseller_org`
            * `customer_org`
            * `iccid`
            * `iccid_with_luhn`
            * `status`
            * `production_date`
            * `imsi`
            * `msisdn`
            * `endpoint`
            * `model`
            * `eid`
            * `satellite_capable`
          required: false
          schema:
            type: string
            pattern: >-
              (id|issuer_org|reseller_org|customer_org|iccid|iccid_with_luhn|status|production_date|imsi|msisdn|endpoint|model|eid):.+
        - name: sort
          in: query
          description: |
            Sort parameter in `<operator><field>` format.
            Sort properties according to a comma-separated list from the allowed fields:

            * `id`
            * `issuer_org`
            * `reseller_org`
            * `customer_org`
            * `iccid`
            * `eid`
            * `status`
            * `production_date`
            * `endpoint`
            * `model`

            If no sorting options are specified, the response will be sorted by `id`.

            Supported operators:
            * `-`: Descending order
            * `+`: Ascending order

            The response will be shown in ascending order if no operator is specified.
          required: false
          schema:
            type: string
            pattern: (^-?(id|issuer_org|reseller_org|customer_org|iccid|eid|status|production_date|endpoint|model)),?
        - name: page
          in: query
          description: Current page number
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          description: Defines the number of items per page (max. 2500)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2500
            default: 2000
      responses:
        '200':
          description: Successfully returned a list of SIMs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1SimGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

