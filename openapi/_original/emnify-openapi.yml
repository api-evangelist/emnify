      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primary:
                  type: string
                secondary:
                  type: string
                ip_address_version:
                  type: integer
              required:
                - primary
                - secondary
                - ip_address_version
      security:
        - bearerAuth: []
