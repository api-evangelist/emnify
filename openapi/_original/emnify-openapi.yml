  /api/v1/service_profile/{profile_id}/traffic_limit:
    get:
      operationId: serviceProfiles_ListServiceProfileTrafficLimits
      summary: List data limits of a service profile
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ServiceProfile.TrafficLimit` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Lists the data limits of a service profile.
        Each data limit has its own `volume`.

        Data limits don't turn off other traffic limits, but you can use them to get the same result.
      tags:
        - serviceProfiles
      parameters:
        - name: profile_id
          in: path
          description: Numeric ID of the service profile.
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceProfileTrafficLimit'
        '403':
          description: >
            The service profile doesn't exist or doesn't belong to your organization, or your role doesn't include the
            permission to list data limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListServiceProfileTrafficLimitsRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: serviceProfiles_AddServiceProfileTrafficLimit
      summary: Add a data limit to a service profile
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ServiceProfile.TrafficLimit` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Adds a data limit to a service profile.

        A data limit defines how much data each device with this service profile can use in a period.

        Use data limits to manage data usage and avoid overage charges.


        In the request, set the service type, period, volume, and warning percentage.


        <Note>
          Only users with the **User** or **Administrator** role can use this endpoint.
          Adding a data limit that already exists returns a `409` error.
        </Note>


        To change a data limit, delete it and add a new one.

        The exception is a temporary [traffic limit
        extension](/developers/api/endpoint/create-endpoint-traffic-limit-extension), which you can create without
        deleting the data limit.
      tags:
        - serviceProfiles
      parameters:
        - name: profile_id
          in: path
          description: Numeric ID of the service profile.
          required: true
          schema:
            type: number
            format: double
      responses:
        '201':
          description: |
            The API created the data limit.
            The response contains the new data limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileTrafficLimit'
        '400':
          description: |
            The request body is invalid, for example because a required field is missing or a value isn't supported.
            `message` lists each invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddServiceProfileTrafficLimitRequestBadRequestError'
        '403':
          description: >
            The service profile doesn't exist or doesn't belong to your organization, or your role doesn't include the
            permission to manage data limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddServiceProfileTrafficLimitRequestForbiddenError'
        '409':
          description: |
            The service profile already has a data limit for this service with the same `satellite_only` value.
            To change a data limit, delete it and add a new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddServiceProfileTrafficLimitRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  $ref: >-
                    #/components/schemas/ApiV1ServiceProfileProfileIdTrafficLimitPostRequestBodyContentApplicationJsonSchemaService
                  description: |
                    Service type to which the limit applies.
                    The only supported service type is `Data`, which has an ID of `38`.
                satellite_only:
                  type: boolean
                  description: >
                    Which data traffic the limit counts.

                    This field is required, even if your devices don't use satellite connectivity.

                    If you're unsure which value to use, set it to `false`.


                    - `false`: the limit counts data over all radio access technology (RAT) types. Use this for most
                    data limits.

                    - `true`: the limit only counts data over satellite RAT types. Satellite data costs more than other
                    data, so use this to set a separate limit for it.


                    A service profile can have one data limit with `false` and one with `true` for each service.
                period:
                  $ref: >-
                    #/components/schemas/ApiV1ServiceProfileProfileIdTrafficLimitPostRequestBodyContentApplicationJsonSchemaPeriod
                  description: |
                    Period of the limit.
                    The only supported period is `Monthly`, which uses calendar months and has an ID of `2`.
                    The limit resets at 00:00 UTC on the first day of each month.
                volume:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9007199254740990
                  description: |
                    Limit threshold in the atomic units of the service type, which is bytes for data.
                    It's the amount of data each device can use in each period before it reaches the limit.
                warning_percent:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: >
                    Percentage of the limit volume at which the system sends an Endpoint data traffic limit warning
                    event (event type `65`, see [Event type object](/developers/reference/events#event-type-object)).

                    For example, if you set it to `80`, the system sends the event when a device has used 80% of the
                    limit volume.
              required:
                - service
                - satellite_only
                - period
                - volume
      security:
        - bearerAuth: []
    delete:
      operationId: serviceProfiles_RemoveServiceProfileTrafficLimits
      summary: Delete all data limits of a service profile
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ServiceProfile.TrafficLimit` + `Delete` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-serviceprofile-trafficlimit-delete "This permission also grants 1 other endpoint")</span>

