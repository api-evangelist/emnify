          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Retrieves the collection of user accounts, filtered, sorted and paged accourding to query parameters.
      tags:
        - userManagement
      parameters:
        - name: page
          in: query
          description: Current page number
          required: false
          schema:
            type: number
            format: double
        - name: q
          in: query
          description: >
            Filter parameter in `<filter>:<value>` format. Multiple filters must be in the format of a comma separated
            list of the following fields:


            * `id`

            * `status`

            * `name`

            * `username`

            * `organisation`
          required: false
          schema:
            type: string
            pattern: (id|status|name|username|organisation):.+
        - name: per_page
          in: query
          description: Defines the number of items per page
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          description: |
            Sort parameter in `<operator><field>` format.
            Expects a comma-separated list from the allowed fields:

            * `id`
            * `status`
            * `name`
            * `username`
            * `organisation`
            * `created`
          required: false
          schema:
            type: string
            pattern: '-?(id|status|name|username|organisation|created),?'
      responses:
        '200':
          description: Successfully returned a list of Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1UserGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPerPageSortByQAndPageGetRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: userManagement_UserPerPageSortByQAndPagePost
      summary: Create user
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>


        Creates a user which is *not active and has no password assigned*.

        The URL to get the user details is provided as Location Header in the response.


        #### ACTIVATION


        Upon creation, the user account undergoes an activation process (see services below ) in which she receives an
        email with activation link.

        Following this link the user is asked to set the password and upon successful completion of this process, the
        account becomes active and operational.


        Provided fields:


        * `username` (String required) - has to be the email of this user

        * `name` (String required)

        * `organisation` (Object optional) -  **may be provided** by regular user, but **is required** for master user.

        * `roles` (List of Objects optional) - List of one or more role Ids to be assigned at once. If missing, a
        default role is assigned


        #### Notes


        * Password is not provided. Separate calls provide password management.

        * When the organisation of the new user is not specified in the request, it is inherited from the user creating
        the account.


        A regular user is allowed to specify **only organisations which are direct children** of his/her own
        organisation, or his/her own organisation.

