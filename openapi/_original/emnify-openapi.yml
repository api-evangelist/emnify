        </Info>

        Updates the details of an endpoint.

        <Note>
          Execute this operation sequentially - wait for each request to complete before starting the next.

          For bulk updates, use [`PATCH /api/v2/endpoint/multi`](/developers/api/endpoint/bulk-update-endpoint) instead (supports up to 2,000 endpoints).
        </Note>

        <Warning>
          emnify charges for activated SIMs, even if the endpoint `status` is set to **Disabled**.
          To avoid accruing unexpected charges, update the SIM `status` to **Suspended** (`"id": 2`).
        </Warning>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Endpoint updated successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            User doesn't have permission to bulk update endpoints
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: |
            Appears in one of the following cases:

            - IP address space isn't found
            - IP address space is full
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: |
            Appears in one of the following cases:

            - Service profile is invalid
            - Tariff profile is invalid
            - Status is invalid
            - IP address space is invalid
            - IP address is invalid
            - SIM is invalid
            - Both `tags` and `tag_assignments` were provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointByIdPatchRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_profile:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaServiceProfile
                tariff_profile:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaTariffProfile
                status:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaStatus'
                ip_address_space:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaIpAddressSpace
                sim:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaSim'
                name:
                  type: string
                tags:
                  type:
                    - string
                    - 'null'
                  description: |
                    Comma-separated tag names replacing the tags currently assigned to the endpoint.
                    Tags that don't exist yet are created, an empty string removes all tags.
                    Sending `null` leaves the current tags unchanged, the same as omitting the field.

                    <Warning>
                      Deprecated. Use `tag_assignments` instead.
                    </Warning>
                  deprecated: true
                tag_assignments:
                  type: array
                  items:
                    type: integer
                  description: |
                    IDs of existing tags replacing the tags currently assigned to the endpoint.
                    An empty array removes all tags.

                    <Info>
                      Mutually exclusive with `tags`. Provide at most one of the two.
                    </Info>
                imei:
                  type: string
                imei_lock:
                  type: boolean
                ip_address:
                  type: string
              required:
                - service_profile
                - tariff_profile
                - status
                - ip_address_space
                - sim
                - name
                - imei
                - imei_lock
                - ip_address
      security:
        - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/connectivity:
    get:
      operationId: endpoint_EndpointConnectivityByIdGet
      summary: Endpoint connectivity status
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Connectivity` + `Get` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-connectivity-get "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>


        Retrieve details about current connectivity status of endpoint.

        The following is a list of possible statuses:


        * `ATTACHED`:

        The Endpoint has succesfully attached to the Home Core network in the past.

        The device will be shown as `ATTACHED` until the visited network has signaled that the device is
        inactive/offline.

        Usually the visited network informs the Core Network within 1-2 days after a device went offline.


        * `ONLINE`:

        The Endpoint has an active data connection


        * `OFFLINE`:

        The Endpoint has not attached to the core network yet or the device was previously attached but the visited
        network signaled that the device had no activity for the last 1-2 days.

        Note: The device is not reachable for external services (e.g. SMS, MSRN lookup).


        * `BLOCKED`:

        The device is not granted service. Endpoints are assigned this status when they have exceeded traffic limits.
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointConnectivityByIdGet_Response_200'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointConnectivityByIdGetRequestForbiddenError'
      security:
        - bearerAuth: []
    patch:
      operationId: endpoint_UpdateEndpointConnectivityById
      summary: Reset endpoint connectivity
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Connectivity` + `Update`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>

        Dispatches a message that causes either a `Cancel Location`, `Delete PDP Context`, or both sent to the endpoint.
        The return of the call doesn't yet mean the event has been sent towards the device.

        <Info>
          Master organization types can reset any endpoints inside their organization hierarchy.
          Enterprises may only reset connectivity of own endpoints.
        </Info>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successful, no content.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: Calling organization is not of correct type.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Endpoint not found.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pdp_context:
                  oneOf:
                    - description: Any type
                    - type: 'null'
                location:
                  oneOf:
                    - description: Any type
                    - type: 'null'
      security:
        - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/event:
    get:
      operationId: endpoint_EndpointEventsByID
      summary: List endpoint events
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Event` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Returns the list of events, filtered, sorted and paged according to query parameters.

        <Info>
        A full list of events is found in section "Retrieve Event Types" (`/api/v1/event/type`).
        </Info>

        <Error>
          This API endpoint deviates from the specified conventions and may not return the same HTTP Codes as the higher layer call (`/api/v1/endpoint/{endpoint_id}`).
          In case the requested `{endpoint_id}` doesn't exist or is not accessible for the user, **HTTP 200** will be returned with empty **[]** as long as the provided `{endpoint_id}` is a number and all parameters are valid.

          Please take that into consideration when building automation on top of the error behaviour of this endpoint.
        </Error>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
        - name: page
          in: query
          description: Current page number
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          description: Defines the number of items per page
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          description: |
            Sort properties according to a comma separated list of accepted fields. Valid fields are:

            * `id` - (**event id**)
            * `timestamp` - (**event timestamp**)
            * `source` - (**event source**)
            * `severity` - (**event severity**)
            * `alert` - (**alert status**)
            * `organisation` - (**organisation name**)
            * `user` - (**user id**)
            * `endpoint` - (**endpoint name**)
            * `tags` - (**endpoint tags**)
            * `ip_address` - (**endpoint ip_address**)
            * `iccid` - (**sim iccid**)
            * `imsi` - (**sim imsi**)
            * `type` - (**event type**)
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: >
            Filter parameter in `<filter>:<value>` format.

            Multiple filters must be a comma-separated list of the following fields:


            * `from` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, **only valid with until**)

            * `until` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, **only valid with from**)

            * `type` (**event_type**, numerical)

            * `source` (**event_type**, numerical, e.g. 0 = Network), 1 = Policy Control, 2 = API)

            * `severity` (**event_severity**, numerical, e.g. 0 = Info, 1 = Warn), 2 = Critical)

            * `alert` (boolean, e.g. true, false)

            * `description` (**event description**, string)

            * `organisation` (**organisation name**, string)

            * `user` (**user name**, string)

            * `endpoint` (**endpoint name**, string)

            * `tags` (**endpoint tags**, string)

            * `tag_id` (**endpoint tag ID**, numerical, matches events whose endpoint has the tag. Tag IDs are listed in
            the endpoint's `tag_assignments`)

            * `ip_address` (**endpoint IP address**, valid IPv4/IPv6 address)

            * `imei` (**endpoint imei**, numerical string)

            * `iccid` (**sim iccid**, numerical string)

            * `imsi` (**sim imsi**, numerical string)

            * `timestamp` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, for querying events of 1 day, deprecated in future)

            * `iccid_with_luhn` (**sim iccid with Luhn**, numerical string)

            * `network` (**endpoint network**, string, e.g. Telekom)

            * `rat` (**event pdp context rat type**, numerical string, e.g. 6)

            * `country` (**endpoint country**, string, e.g. Germany)


            Some filters can accept up to 6 values which must be separated by the pipe symbol (`|`) or url-encoded as
            (`%7C`):


            * `iccid` (q: iccid:1234567890123456789|8988303000123456789)

            * `iccid_with_luhn` (q: iccid_with_luhn:12345678901234567891|89883030001234567891)

            * `endpoint` (q: endpoint:example_endpoint_name|another_endpoint_name)

            * `type` (q: type:example_event_type|another_event_type)

            * `network` (q: network:example_network|another_network)

            * `rat` (q: rat:example_rat|another_rat)

            * `country` (q: country:example_country|another_country)

            * `tag_id` (q: tag_id:7|12, matches events whose endpoint has any of the tags)
          required: false
          schema:
            type: string
            pattern: >-
              (from|until|type|source|severity|alert|description|organisation|user|endpoint|tags|tag_id|ip_address|imei|iccid|iccid_with_luhn|imsi|timestamp|network|rat|country):.+
      responses:
        '200':
          description: Successfully returned a list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdEventGetResponsesContentApplicationJsonSchemaItems'
        '400':
          description: |
            **Bad Request** due to incorrect **Paging** Parameters, **Sorting** Parameter or incorrect `{endpoint_id}`
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointEventsByIDRequestForbiddenError'
        '422':
          description: |
            **Unprocessable Entity** due to incorrect **Query** parameters
          content:
            application/json:
              schema:
                description: Any type
      security:
        - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/stats:
    get:
      operationId: endpoint_EndpointStatsByIdGet
      summary: Endpoint usage and cost statistics
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Stats` + `Get` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-stats-get "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>


        <Warning>
          You can only retrieve data traffic costs for organizations without multi-inclusive volumes.
        </Warning>


        Retrieves endpoint usage and cost statistics for a given ID.

        Usage statistics are sorted by `data` and `sms`.


        Returns statistics from the following periods:


        - `last_month`: Previous billing month, from the first to last day (for example, April 1-30, 2023, when you send
        the request sometime in May 2023).

        - `current_month`: Current month, with statistics calculated up to and including the date requested (for
        example, May 1-8, 2023, when you sent the request on May 8, 2023).

        - `last_hour`: Previous 60 minutes, accumulated per minute and organized by data or SMS received by the device
        (`rx`) and transmitted by the device (`tx`).


        <Info>
          `last_month` and `current_month` are only included in the responses if traffic exists.
        </Info>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully returned the endpoint statistics associated with the provided `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointStatsByIdGet_Response_200'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatsByIdGetRequestForbiddenError'
      security:
        - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/stats/daily:
    get:
      operationId: endpoint_EndpointStatsDailyByIdGet
      summary: Retrieve daily usage statistics for an endpoint
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Stats` + `Get` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-endpoint-stats-get "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Returns daily usage statistics for a specific endpoint, including cellular data and SMS volumes.

        By default, returns statistics for the current month.
        Use `start_date` and `end_date` query parameters to specify a custom date range.

        <Note>
          Historical data is available for up to **13 months**.
        </Note>

        <Warning>
          Data traffic cost statistics (`cost` field in the `data` object) have been deprecated.
        </Warning>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          description: |
            Filters by start date, provided in a `YYYY-MM-DD` format.

            <Info>
              If you don't define an end date, the response will include 6 months of data, beginning on the current date.
            </Info>
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: |
            Filters by end date, provided in an `YYYY-MM-DD` format.

            <Info>
              If you don't define a start date, the response will only return data from the month indicated in your end date.
            </Info>
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: |
            Successfully returned the daily endpoint statistics.

            Each day's entry contains:

            - `date`: The date in YYYY-MM-DD format
            - `data`: Cellular data usage (volume in MB)
            - `sms`: SMS usage (volume as message count)

            Volume fields include `volume` (total), `volume_tx` (transmitted), and `volume_rx` (received).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdStatsDailyGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatsDailyByIdGetRequestForbiddenError'
      security:
        - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/sms:
    get:
      operationId: endpoint_EndpointSmsByIdGet
      summary: List sent and received SMS
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Sms` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Returns the list of SMS sent and received by this endpoint.

        A description of the SMS statuses is as follows:

        - `1`: Delivery attempt pending
        - `2`: In progress
        - `3`: Buffered
        - `4`: Delivered
        - `5`: Failed
        - `6`: Expired
        - `7`: Canceled
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdSmsGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointSmsByIdGetRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: endpoint_EndpointSmsByIdPost
      summary: Send SMS to an endpoint
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Sms` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Sends a mobile terminating SMS (MT-SMS) to a connected device.

        The device must have an active SIM with SMS capability enabled in its service profile.


        ## Use cases


        ### Standard SMS


        Send an SMS with a numeric sender ID.

        Set `source_address` to the sender's phone number (for example, `12345689`) and include your message in
        `payload`.


        ### Alphanumeric sender ID


        Display a custom sender name instead of a phone number.

        Set `source_address` to your brand name (for example, `CompanyName`, up to 11 characters) and include
        `source_address_type` with `id: 208`.


        <Info>

        Alphanumeric sender IDs are one-way only.

        Recipients can't reply directly to these messages.

        </Info>


        ### Person-to-Application (P2A) SMS


        Receive SMS responses at your server.

        Set `dest_address` with a callback identifier.

        The platform forwards incoming messages to the API callback URL configured in your service profile.


        ### Concatenated SMS


        Send messages longer than 160 characters by splitting them across multiple API calls.

        Each call requires a `udh` (User Data Header) that identifies the message sequence.


        The UDH format `050003XXYYZZ` contains:


        - `XX`: Unique message reference (for example, `CC`)

        - `YY`: Total number of parts (for example, `02` for 2 parts)

        - `ZZ`: Current part number (for example, `01` for part 1)


        For more information, see the [3GPP TS 23.040
        specification](https://portal.3gpp.org/desktopmodules/Specifications/SpecificationDetails.aspx?specificationId=747).
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointSmsByIdPost_Response_201'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointSmsByIdPostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  description: |
                    The SMS message content.
                    Must be UTF-8 encoded.
                    Maximum 160 characters for a single SMS, or use `udh` for longer messages.
                source_address:
                  type: string
                  maxLength: 21
                  description: |
                    The sender identifier displayed on the recipient's device.
                    Can be an MSISDN (phone number), short code, or alphanumeric string.
                    Alphanumeric strings are limited to 11 characters per GSM specifications.
                source_address_type:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdSmsPostRequestBodyContentApplicationJsonSchemaSourceAddressType
                  description: |
                    Defines the format of `source_address`.
                    Required when using alphanumeric sender IDs.
                dest_address:
                  type: string
                  description: >
                    The callback identifier for Person-to-Application (P2A) SMS.

                    When set, incoming SMS responses are forwarded to the API callback URL configured in your service
                    profile.
                udh:
                  type: string
                  description: |
                    User Data Header for concatenated SMS.
                    Encoded as a hexadecimal string following 3GPP TS 23.040.
                    For example, `050003CC0201` indicates message 1 of 2 in sequence `CC`.
                dcs:
                  type: integer
                  description: |
                    Data Coding Scheme per 3GPP TS 23.038.
                    Controls character encoding (for example, `0` for GSM 7-bit default alphabet, `8` for UCS2/UTF-16).
                expiry_date:
                  type: string
                  format: date-time
                  description: |
                    The deadline for delivery attempts.
                    If the SMS can't be delivered by this time, it's discarded.
                    ISO 8601 format.
              required:
                - payload
      security:
        - bearerAuth: []
