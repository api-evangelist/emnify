  /api/v1/organisation/{org_id_or_my}/inclusive_volume/{inclusive_volume_id}:
    put:
      operationId: organization_AssignRatezoneInclusiveVolume
      summary: Assign a ratezone inclusive volume to an organization
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.InclusiveVolume` + `Add`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Assigns a pre-configured ratezone inclusive volume to the specified organization.


        This can be done in self-service as well as for direct child organizations.

        Only postpaid customers can assign

        inclusive volumes in self-service, while parent organizations can assign inclusive volumes for both postpaid and
        prepaid child organizations.

        The inclusive volume is charged and calculated against traffic charges accordingly in every bill

        that is refreshed from that point on.

        Inclusive volume is counted per device on a monthly basis, the data can be pooled as well or be treated per
        individual device.


        Only inclusive volumes of ratezones belonging to the tariffs assigned to the selected organization can be
        chosen.


        Enterprise organizations are only allowed to upgrade to a higher inclusive volume if there is already one active
        in the current month.


        The request body is optional. All fields have default values and detailed constraints are specified in the
        schema below.
      tags:
        - organization
      parameters:
        - name: org_id_or_my
          in: path
          description: Numerical ID of an Organization or the string `my` to use the currently authorized organisation
          required: true
          schema:
            type: string
            pattern: ^(my)|(\d+)$
            default: my
        - name: inclusive_volume_id
          in: path
          description: |
            Numerical ID of a ratezone inclusive volume.
            Can be retrieved using `GET /api/v1/tariff/{tariff_id}/ratezone/{ratezone_id}/inclusive_volume`.
          required: true
          schema:
            type: number
            format: double
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization_AssignRatezoneInclusiveVolume_Response_201'
        '400':
          description: The request is malformed, e.g. the body cannot be parsed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignRatezoneInclusiveVolumeRequestForbiddenError'
        '404':
          description: |
            Organisation is not accessible or not valid in this context
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        description: |
          Configure the inclusive volume billing period and pooling behavior.
          All fields are optional and will use default values if omitted.
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date-time
                  description: |
                    The first day of the month when this inclusive volume assignment becomes active.
                    Defaults to the first day of the current month.
                    Times are normalized to midnight UTC (times in input are stripped).
                    Must be the current month or a future month.
                end_date:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  default: null
                  description: |
                    The last day of the month when this inclusive volume assignment expires.
                    Defaults to `null` (indefinite duration).
                    When specified, must be the last day of a calendar month.
                    Times are normalized to 23:59:59 UTC (times in input are stripped).
                    Must be on or after the `start_date`.
                pooled:
                  type: boolean
                  default: true
                  description: |
                    Whether the inclusive volume is shared across all devices or tracked individually.
                    - `true` (default): Data consumption is pooled. All devices share the monthly volume limit.
                    - `false`: Each device receives its own quota proportional to the total volume.
      security:
        - bearerAuth: []
