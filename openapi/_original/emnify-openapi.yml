  /api/v1/sim_batch/bic/{bic}:
    get:
      operationId: sim_ValidateSIMBatchByBIC
      summary: Validate SIM batch by BIC
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `SimBatch.Bic` + `Get`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Checks the given BIC code and the contained SIMs if they can be registered.
      tags:
        - sim
      parameters:
        - name: bic
          in: path
          description: The BIC of the SIM batch. Leading hash symbols must be URL encoded (`%23`).
          required: true
          schema:
            type: string
            pattern: '%23[0-9A-Z]{15}|[0-9A-Z]{16}'
      responses:
        '200':
          description: Batch is valid and can be registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIM_ValidateSIMBatchByBIC_Response_200'
        '400':
          description: Batch is already registered
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSIMBatchByBICRequestForbiddenError'
        '404':
          description: No Batch with the given BIC found
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Batch contains SIMs registered to another organisation
          content:
            application/json:
              schema:
                description: Any type
      security:
        - bearerAuth: []
    patch:
      operationId: sim_RegisterSIMBatchByBIC
      summary: Register a given batch by BIC
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `SimBatch.Bic` + `Add`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>

        Registers the given SIM batch, assigns all SIMs to the organisation,
        and sets the status of all contained SIMs to the given value.

        If the `factory_test_mode_allowed` flag is set to true on the tariff plan assignment
        or it is enabled in the tariff plan, the SIM batch can be also registered with an initial
        status of `4 = Factory Test`, thus setting all of the contained SIMs to factory test
        status. In turn, the `activation_date` of these SIMs will not be set yet, but when the factory
        test volume is consumed, the auto activation date is reached or they are patched to `Activated`
        state afterwards.
      tags:
        - sim
      parameters:
        - name: bic
          in: path
          description: The BIC of the SIM batch. Leading hash symbols must be URL encoded (`%23`).
          required: true
          schema:
            type: string
            pattern: '%23[0-9A-Z]{15}|[0-9A-Z]{16}'
      responses:
        '200':
          description: Batch successfully registered and assigned all SIMS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIM_RegisterSIMBatchByBIC_Response_200'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSIMBatchByBICRequestForbiddenError'
        '422':
          description: |
            Could not register the given batch. Reasons may be:
            * Could find no batch with that BIC
            * Batch already registered
            * Batch contains SIMs registered to other organisations
            * Attempted to register to `Factory Test` status when it is disabled in tariff plan
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sim_status:
                  $ref: '#/components/schemas/ApiV1SimBatchBicBicPatchRequestBodyContentApplicationJsonSchemaSimStatus'
      security:
        - bearerAuth: []
