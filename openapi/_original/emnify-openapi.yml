openapi: 3.1.0
info:
  title: Enterprise
  version: 1.0.0
paths:
  /api/v1/authenticate:
    post:
      operationId: authentication_Authenticate
      summary: Retrieve authentication token
      description: >
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          Public endpoint. No permission required.
        </Info>


        Returns a [JSON Web Token (JWT)](/developers/auth/jwts) `auth_token` for authenticating further requests to the
        API.


        <Note>
          This API path has a rate limit of 100 requests per IP in a 5-minute window.
          Make sure to store your authentication token to avoid hitting this limit.
          For more information, see [Rate limits](/developers/api-guidelines/rate-limits).
        </Note>


        ### Multi-factor authentication flow


        When multi-factor authentication (MFA) is enabled for a user account:


        1. **Initial login**: Send your username and SHA-1 hashed password.
          If MFA is enabled and the device isn't trusted, you receive an `mfa_token` instead of `auth_token` in the response and a one-time password (OTP) via email.
        2. **MFA verification**: Send the `mfa_token` with the 6-digit OTP `code`.
          Optionally include `trusted_device` information to skip MFA for 90 days.
        3. **Subsequent logins**: If you included a trusted device fingerprint during verification, send your username
        and SHA-1 hashed password with the `fingerprint` to bypass MFA.


        For more information, see [Multi-factor authentication](/developers/auth/multi-factor-authentication).
      tags:
        - authentication
      responses:
        '200':
          description: Successful Authentication Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authentication_Authenticate_Response_200'
        '400':
          description: The request body is malformed or fails validation.
          content:
            application/json:
              schema:
                description: Any type
        '401':
          description: >
            The response body is empty for most authentication failures (invalid credentials, suspended or deleted user,
            etc.).

            When account lockout is triggered after three consecutive failed authentication attempts, the response body
            contains the `TooManyRequests` error and further attempts are blocked for five minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateRequestUnauthorizedError'
        '404':
          description: |
            Unexpected error in API call.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateRequestNotFoundError'
      requestBody:
        description: |
          Authenticate with an [application token](/developers/auth/application-tokens).

          <Info>
            **Temporary exception**:
            [User credentials](/developers/auth/user-credentials) are currently required for operations that span multiple workspaces, such as switching between workspaces or transferring SIMs.
            These APIs are being updated to support application tokens.
          </Info>
        content:
          application/json:
            schema:
              type: object
              properties:
                application_token:
                  type: string
                  description: Application token for authentication
                username:
                  type: string
                  description: Username for user credentials authentication
                password:
                  type: string
                  format: password
                  description: |
                    User password.
                    Must be SHA-1 hashed when authenticating with user credentials.
                fingerprint:
                  type: string
                  description: Device fingerprint for trusted device authentication (skips MFA)
                refresh_token:
                  type: string
                  description: Refresh token to obtain a new `auth_token`
                mfa_token:
                  type: string
                  description: MFA token received when MFA is enabled
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6-digit one-time password (OTP) for MFA verification
                trusted_device:
                  $ref: '#/components/schemas/ApiV1AuthenticatePostRequestBodyContentApplicationJsonSchemaTrustedDevice'
                  description: Device information to register as trusted (90-day MFA exemption)
  /api/v1/user/mfa:
    post:
      operationId: authentication_postMfa
      summary: Create an MFA key
      description: >
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          No permission required. Available to all roles.
        </Info>


        Generate and store a MFA key for the requesting user. After this call, the MFA key has the status `activation
        pending` and must be activated through a separate call (`/api/v1/user/mfa/{id}`).


        You must provide following fields with this request:


        * `type` (Object required)
          - `id` (Number)
        * `password` (String required) - User password


        The **MFA key** object returned by the server contains the following properties:


        * `id` (Integer) - The unique ID of this MFA key

        * `status` (Object) ID (Integer) - Id of status of this MFA key
          - `description` (String) - description of the status
        * `type` (Object) ID (Integer) - Id of type of this MFA key
          - `description` (String) - description of the type
        * `secret_key` (String) - Secret key (encoded in Base32) for this MFA key, will be displayed only on creation

        * `otpauth` (String) - Secret key as a URI encoded for QR codes, will be displayed only on creation

        * `creation_date` (Timestamp) - Timestamp when this MFA key was created - type: ISO 8601 timestamp format

        * `activation_date` (Timestamp) - Timestamp when this MFA key was activated - type: ISO 8601 timestamp format
      tags:
        - authentication
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authentication_postMfa_Response_200'
        '409':
          description: |
            Unexpected error in API call.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMfaRequestConflictError'
        '422':
          description: |
            Unprocessable Entity.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMfaRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/ApiV1UserMfaPostRequestBodyContentApplicationJsonSchemaType'
                password:
                  type: string
              required:
                - type
                - password
      security:
        - bearerAuth: []
  /api/v1/user/mfa/{key_id}:
    patch:
      operationId: authentication_UserMfaByIdPatch
      summary: Activate MFA key
      description: >
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          No permission required. Available to all roles.
        </Info>


        Activates a pending MFA key for the authenticated user.


        After you [create an MFA key](/developers/api/authentication/post-mfa), the key has status `Activation Pending`.

        To complete setup, call this endpoint with the MFA key ID and a valid 6-digit time-based one-time password
        (TOTP) generated from the `secret_key` or `otpauth` URI returned during creation.


        Once activated, the MFA key status changes to `Active`, and MFA is enforced on subsequent logins with [user
        credentials](/developers/auth/user-credentials).


        For more information, see [Multi-factor authentication](/developers/auth/multi-factor-authentication).
      tags:
        - authentication
      parameters:
        - name: key_id
          in: path
          description: |
            The unique identifier of the MFA key to activate.
            This ID is returned when you [create the MFA key](/developers/api/authentication/post-mfa).
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: MFA key activated successfully. No content returned.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: |
            MFA key not found.
            Verify the `key_id` is correct and belongs to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaByIdPatchRequestNotFoundError'
        '409':
          description: |
            MFA key is already activated.
            Each key can only be activated once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaByIdPatchRequestConflictError'
        '422':
          description: |
            Invalid TOTP code.
            The code didn't match the expected value.
            This can happen if:

            - The code was entered incorrectly
            - The code expired (codes are valid for 30 seconds)
            - The device clock is out of sync with the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaByIdPatchRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/ApiV1UserMfaKeyIdPatchRequestBodyContentApplicationJsonSchemaStatus'
                  description: The target status for the MFA key.
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: >
                    The 6-digit TOTP code generated by your authenticator app using the `secret_key` or `otpauth` URI
                    from the MFA key creation response.


                    This code changes every 30 seconds.
              required:
                - status
                - code
      security:
        - bearerAuth: []
  /api/v1/user/{user_id}/mfa/{key_id}:
    delete:
      operationId: authentication_UserMfaByUserIdAndKeyIdDelete
      summary: Delete an MFA key
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Mfa` + `Delete`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Delete an MFA key for a given user.

        An own MFA key can also be deleted with a call to `/api/v1/user/my/mfa/{key_id}`
      tags:
        - authentication
      parameters:
        - name: key_id
          in: path
          description: Key ID
          required: true
          schema:
            type: number
            format: double
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: number
            format: double
      responses:
        '204':
          description: >
            The server has successfully fulfilled the request and that there is no additional content to send in the
            response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaByUserIdAndKeyIdDeleteRequestForbiddenError'
        '404':
          description: |
            Unexpected error in API call.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaByUserIdAndKeyIdDeleteRequestNotFoundError'
      security:
        - bearerAuth: []
  /api/v1/user/mfa/status:
    get:
      operationId: authentication_UserMfaStatusGet
      summary: List MFA key statuses
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Mfa.Status` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Retrieve a list of possible MFA Key statuses.
      tags:
        - authentication
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1UserMfaStatusGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaStatusGetRequestForbiddenError'
      security:
        - bearerAuth: []
  /api/v1/user/mfa/type:
    get:
      operationId: authentication_UserMfaTypeGet
      summary: List MFA key types
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Mfa.Type` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>

        Retrieve a list of possible MFA Key types.
      tags:
        - authentication
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1UserMfaTypeGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaTypeGetRequestForbiddenError'
      security:
        - bearerAuth: []
  /api/v1/user/{user_id}/mfa/trusted_device:
    get:
      operationId: authentication_UserMfaTrustedDeviceByUserIdGet
      summary: List trusted devices
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Mfa.TrustedDevice` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Returns the list of trusted devices for a given user.

        The list of one's own trusted devices can also be retrieved with a call to either
        `/api/v1/user/my/mfa/trusted_device` or `/api/v1/user/mfa/trusted_device`
      tags:
        - authentication
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1UserUserIdMfaTrustedDeviceGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaTrustedDeviceByUserIdGetRequestForbiddenError'
        '404':
          description: |
            Unexpected error in API call.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaTrustedDeviceByUserIdGetRequestNotFoundError'
      security:
        - bearerAuth: []
  /api/v1/user/{user_id}/mfa/trusted_device/{device_id}:
    delete:
      operationId: authentication_UserMfaTrustedDeviceByUserIdAndDeviceIdDelete
      summary: Delete a trusted device
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Mfa.TrustedDevice` + `Delete`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>


        Deletes a trusted device.


        Removing one's own trusted device can also be performed at either `/api/v1/user/my/mfa/trusted_device/{id}` or
        `/api/v1/user/mfa/trusted_device/{id}`
      tags:
        - authentication
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: number
            format: double
        - name: device_id
          in: path
          description: Device ID
          required: true
          schema:
            type: number
            format: double
      responses:
        '204':
          description: >-
            The server has successfully fulfilled the request and that there is no additional content to send in the
            response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaTrustedDeviceByUserIdAndDeviceIdDeleteRequestForbiddenError'
        '404':
          description: |
            Unexpected error in API call.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaTrustedDeviceByUserIdAndDeviceIdDeleteRequestNotFoundError'
      security:
        - bearerAuth: []
  /api/v2/user/invitation:
    post:
      operationId: passwordManagementAndActivation_UserV2Invitation
      summary: Invite a user
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `User.Invitation` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Invite a user to a Workspace by specifying username and the roles that the user will have in the organization.
        This user is created and a `User invited` event is sent.
        There is no additional action such as an email sent.

        The following fields may be provided:
        - `username` (String) - Email of the invited user
        - `name` (String) - Name of the invited user
        - `organisation` (Object) - Defaults to the default Workspace of the requesting user
        - `roles` (Array) - Assigns the **Administrator** role by default

        If the invited user doesn't exist, a new user is created and the `organisation.id` is their default Workspace.
        If the invited user already exists, the user is assigned to the Workspace.
        This fails if the Workspace feature isn't enabled on the target organization's tariff plan.
      tags:
        - passwordManagementAndActivation
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Password_management_and_activation_UserV2Invitation_Response_201'
        '400':
          description: |
            Some of the given parameters have invalid values, detailed description will be given in the response
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Current logged in user is not permitted to invite users.
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: |
            There is already an active user with the same username, so this cannot be taken
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                name:
                  type: string
                organisation:
                  $ref: '#/components/schemas/ApiV2UserInvitationPostRequestBodyContentApplicationJsonSchemaOrganisation'
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2UserInvitationPostRequestBodyContentApplicationJsonSchemaRolesItems'
              required:
                - username
                - name
      security:
        - bearerAuth: []
  /api/v1/user/activation:
    post:
      operationId: passwordManagementAndActivation_UserActivationPost
      summary: Activate user
      description: |
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          Public endpoint. No permission required.
        </Info>

        Activates the user account and sets a password.
        The activation key is sent via email.

        <Info>
          This is a public (unauthenticated) service which ignores auth tokens.
        </Info>
      tags:
        - passwordManagementAndActivation
      responses:
        '204':
          description: >-
            The server has successfully fulfilled the request and that there is no additional content to send in the
            response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                activationKey:
                  type: string
                password:
                  type: string
              required:
                - activationKey
                - password
  /api/v1/user/activation_resend:
    post:
      operationId: passwordManagementAndActivation_UserActivationResendPost
      summary: Resend user activation email
      description: >
        <Info icon="fa-light fa-lock-open" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          Public endpoint. No permission required.
        </Info>


        Re-sends activation mail to the user.


        As this endpoint is open to the public (no authentication token necessary), it requires instead the google
        reCAPTCHA token to ensure that no robot is performing the request.

        Moreover, there's a time limit on how often a given user may be issued with a new activation mail.


        <Info>
          According to the [reCAPTCHA documentation](https://developers.google.com/recaptcha/docs/display) a "Site Key" is necessary.
          If you want to implement this feature in your client, please contact emnify support to obtain this "Site Key" for your domain.
        </Info>
      tags:
        - passwordManagementAndActivation
      responses:
        '204':
          description: >-
            The server has successfully fulfilled the request and that there is no additional content to send in the
            response payload body
          content:
            application/json:
              schema:
                type: object
                properties: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                g-recaptcha-response:
                  type: string
                  description: |
                    Auto-generated from a form using Google reCAPTCHA.
              required:
                - username
                - g-recaptcha-response
  /api/v1/user/password:
    patch:
      operationId: passwordManagementAndActivation_UserPasswordPatch
      summary: Change password
      description: |
        <Info icon="fa-light fa-lock-open" className="permission-callout">
