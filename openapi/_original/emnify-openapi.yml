  /api/v1/endpoint/{endpointId}/flowlogs/destination:
    get:
      operationId: flowLogs_ListEndpointFlowLogsByDestination
      summary: Retrieve Flow Logs by destination
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.FlowLogs.Destination` + `List`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Retrieves Flow Log activity for an endpoint, grouped by destination hostname, IP address, port, and protocol.

        By default, the response covers the last hour.
        Use `started_from` in the `q` parameter to look back up to **30 days**.

        Filters follow the standard `q=<field>:<criteria>` syntax:
        - Combine multiple filters on different fields with `,` (AND).
        - Combine multiple values for the same field with `||` (OR).

        Use `sort` to order the results and `page` / `per_page` to paginate.
      tags:
        - flowLogs
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: number
            format: double
        - name: per_page
          in: query
          description: Number of destination groups to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page
          in: query
          description: |
            Page number to retrieve.
            Starts at `1`.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort
          in: query
          description: |
            Sorts destination groups by field value.
            Use `<operator><field>` format.
            Operators: `-` descending, `+` ascending.

            <Tip>
            You can also combine multiple sort fields with commas (for example, `-started_on,destination_hostname`).
            </Tip>
          required: false
          schema:
            type: string
            pattern: |-
              (^-?(destination_hostname|
              destination_ip|
              destination_port|
              protocol|
              started_on|
              completed_on|
              bytes_up|
              bytes_down)),?
            default: '-started_on'
        - name: q
          in: query
          description: |
            Filters destination groups by field value.
            Use `<field>:<criteria>` format.

            Combine multiple filters with commas (for example, `protocol:TCP,destination_hostname:api.example.com`).
            Use `||` within one field for multiple values (for example, `protocol:TCP||UDP`).

            Time window (optional, each as `<field>:<ISO-8601 UTC>`):

            - `started_from` - Lower bound on flow start
              - Defaults to 1 hour ago
              - Maximum look-back 30 days.
            - `started_until` - Upper bound on flow start
              - Defaults to now.
            - `completed_from` / `completed_until` - Bounds on flow completion time.

            <Warning>
              Window fields must use `:` only (no other operators).
            </Warning>
          required: false
          schema:
            type: string
            pattern: |-
              (destination_hostname|
              destination_ip|
              destination_port|
              protocol|
              started_from|
              started_until|
              completed_from|
              completed_until):.+
      responses:
        '200':
          description: Destination groups for the requested window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdFlowlogsDestinationGetResponsesContentApplicationJsonSchemaItems
        '400':
          description: |
            The request is malformed.

            Common causes:

            - Invalid filter expression syntax in `q`
            - Invalid value for a filter or sort field
            - Datetime not in ISO-8601 format
            - Requested window exceeds the 30-day maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsByDestinationRequestBadRequestError'
        '401':
          description: No token given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsByDestinationRequestUnauthorizedError'
        '403':
          description: Caller lacks permission or the feature is not enabled for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsByDestinationRequestForbiddenError'
        '404':
          description: Endpoint with ID <number> not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsByDestinationRequestNotFoundError'
      security:
        - bearerAuth: []
