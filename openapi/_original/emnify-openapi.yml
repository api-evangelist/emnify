            </Warning>
          required: false
          schema:
            type: string
            pattern: |-
              (destination_hostname|
              destination_ip|
              destination_port|
              protocol|
              flow_id|
              event_type|
              started_from|
              started_until|
              completed_from|
              completed_until):.+
      responses:
        '200':
          description: Detail rows for the requested filter window.
          content:
