      parameters:
        - name: status
          in: query
          description: |
            Numerical ID of the Cloud Connect attachment status

            * `1` - Pending Customer Action
            * `2` - Pending AWS Activation
            * `3` - Pending EGN Activation
            * `4` - Pending CRG Activation
            * `5` - Active
            * `6` - Deactivation Pending
            * `7` - Deactivated
            * `8` - Rolling Back
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1CncBreakoutGetParametersStatus'
        - name: type
          in: query
          description: |
            Numerical ID of the Cloud Connect attachment type

            * `1` - Transit Gateway
            * `2` - IPSec VPN
            * `3` - IPSec VPN BGP
            * `4` - IPSec VPN BGP High Availability
            * `5` - Direct Connect
            * `6` - Shared
            * `7` - Transit Gateway (Classic)
            * `8` - IPSec VPN (Classic)
          required: false
          schema:
            $ref: '#/components/schemas/ApiV1CncBreakoutGetParametersType'
        - name: organisation
          in: query
          description: Numerical ID of an Organization
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1CncBreakoutGetResponsesContentApplicationJsonSchemaItems'
