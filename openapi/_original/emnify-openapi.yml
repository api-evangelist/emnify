  /api/v1/service_profile/{service_profile_id}/d2d:
    get:
      operationId: serviceProfiles_ServiceProfileDeviceToDeviceGet
      summary: Retrieve device-to-device mode of a service profile
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ServiceProfile.D2d` + `Get`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>


        Retrieves the device-to-device (D2D) mode of a service profile.

        D2D controls whether devices assigned to the service profile can exchange IP traffic with other devices in the
        same organization and region.


        A service profile that has never been configured returns `disabled` with `modified_at` set to `null`.


        <Note>
          Device-to-device is opt-in and enabled per organization.
          Until it's enabled for your organization, requests return `403`.
          To request access, contact emnify support.
        </Note>
      tags:
        - serviceProfiles
      parameters:
        - name: service_profile_id
          in: path
          description: The numeric ID of a service profile.
          required: true
          schema:
            type: integer
        - name: org_id
          in: query
          description: |
            Numeric ID of a child organization to act on.
            Omit to use your own organization.
            Returns `403` if the organization isn't a child of yours.
            The service profile must belong to that organization, and device-to-device must be enabled for it.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDevice'
        '401':
          description: Missing or invalid Authorization header.
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: >-
            Your user doesn't have the required permission, device-to-device isn't enabled for the organization, or
            `org_id` isn't a child organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDeviceGetRequestForbiddenError'
        '404':
          description: Service profile not found, or it belongs to another organization.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: '`service_profile_id` or `org_id` isn''t a number.'
          content:
            application/json:
              schema:
                description: Any type
      security:
        - bearerAuth: []
    put:
      operationId: serviceProfiles_ServiceProfileDeviceToDevicePut
      summary: Update device-to-device mode of a service profile
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ServiceProfile.D2d` + `Update`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Sets the device-to-device (D2D) mode of a service profile.
        The response returns the updated configuration, so there's no need for a follow-up `GET` request.

        For devices to communicate, enable device-to-device on the service profile of every device involved.
        If only one side is enabled, return traffic is blocked.
        Devices must belong to the same organization and region.
        Communication across organizations or regions isn't supported.

        Setting `enabled` or `forward_to_backend` requires your organization to have a virtual network.
        Setting `disabled` doesn't require a virtual network.
        Changes take effect without devices reconnecting.

        <Warning>
          `forward_to_backend` only prepares the configuration.
          It requires a default route over [Cloud Connect](/services/cloud-connect), and OpenVPN isn't supported.
          The API accepts the mode without checking your Cloud Connect configuration and returns a warning instead.
          Traffic between devices is dropped until the setup is complete.
        </Warning>

        <Note>
          Device-to-device is opt-in and enabled per organization.
          Until it's enabled for your organization, requests return `403`.
          To request access, contact emnify support.
        </Note>
      tags:
        - serviceProfiles
      parameters:
        - name: service_profile_id
          in: path
          description: The numeric ID of a service profile.
          required: true
          schema:
            type: integer
        - name: org_id
          in: query
          description: |
            Numeric ID of a child organization to act on.
            Omit to use your own organization.
            Returns `403` if the organization isn't a child of yours.
            The service profile must belong to that organization, and device-to-device must be enabled for it.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Device-to-device mode updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDevice'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDevicePutRequestBadRequestError'
        '401':
          description: Missing or invalid Authorization header.
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: >-
            Your user doesn't have the required permission, device-to-device isn't enabled for the organization, or
            `org_id` isn't a child organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDevicePutRequestForbiddenError'
        '404':
          description: Service profile not found, or it belongs to another organization.
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: |
            The organization doesn't have a virtual network, so `enabled` and `forward_to_backend` can't be set.
            Contact emnify support to set one up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceProfileDeviceToDevicePutRequestConflictError'
        '422':
          description: '`service_profile_id` or `org_id` isn''t a number.'
          content:
            application/json:
              schema:
                description: Any type
        '503':
          description: The configuration couldn't be applied. Retry the request.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  $ref: >-
                    #/components/schemas/ApiV1ServiceProfileServiceProfileIdD2DPutRequestBodyContentApplicationJsonSchemaMode
                  description: |
                    Device-to-device mode to set.
                    The value is case-insensitive.
              required:
                - mode
      security:
        - bearerAuth: []
