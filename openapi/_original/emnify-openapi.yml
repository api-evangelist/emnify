          description: Service type to which the limit applies.
        satellite_only:
          type: boolean
          description: |
            Which data traffic the limit counts.
            If `false`, the limit counts data over all radio access technology (RAT) types.
            If `true`, it only counts data over satellite RAT types.
            Satellite data costs more than other data.
        period:
          $ref: '#/components/schemas/ServiceProfileTrafficLimitPeriod'
          description: Period of the limit.
        volume:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740990
          description: Limit threshold in the atomic units of the service type, which is bytes for data.
        warning_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Percentage of the limit volume at which the system sends an Endpoint data traffic limit warning event (event
            type `65`, see [Event type object](/developers/reference/events#event-type-object)).

            Only present if the data limit has a warning percentage.
      required:
        - id
        - service
        - satellite_only
        - period
        - volume
      description: A data limit of a service profile.
