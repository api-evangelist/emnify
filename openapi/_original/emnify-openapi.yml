        </Info>

        Returns the application tokens of the requesting organisation.

        Only tokens in status `ACTIVE` are returned unless the `q` filter asks otherwise.
        The token itself is never returned; it is available only from the response of the create endpoint.
      tags:
        - applicationTokens
      parameters:
        - name: q
          in: query
          description: >
            Filter the tokens.

            The only key is `status`, whose values are the ids that `GET /api/v2/application_token/status` lists:
            `q=status:1` for the active tokens, `q=status:3` for the deleted ones, `q=status:1||3` for both.

            Percent-encode the pipes - `q=status:1%7C%7C3` - as an unencoded `|` is not a legal URI character and is
            rejected before the request arrives.

            Defaults to active tokens only.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationTokenV2'
        '400':
          description: |
            The filter is malformed or names an unknown status.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTokenV2Error'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationTokensRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: applicationTokens_CreateApplicationToken
      summary: Create an application token
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `ApplicationToken` + `Create` <span className="permission-callout__also">[+1 endpoint](/developers/api-guidelines/permission-endpoints#permission-applicationtoken-create "This permission also grants 1 other endpoint")</span>

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>

        Creates an application token for the requesting organisation and returns it.

        The token itself is only available from this response and cannot be retrieved later, so store it immediately.
        The number of active tokens an organisation may hold is limited.
      tags:
        - applicationTokens
      responses:
        '201':
          description: Application token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application_tokens_CreateApplicationToken_Response_201'
        '400':
          description: |
            The payload is invalid or names an unknown role.
            See HTTP response body for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTokenV2Error'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationTokenRequestForbiddenError'
        '422':
          description: The organisation has reached its application token limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTokenV2Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 64
                  description: 'Name of the application token. Letters, digits, spaces and - _ . : / ( ) [ ] @ + # are allowed.'
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2ApplicationTokenPostRequestBodyContentApplicationJsonSchemaRolesItems'
                  description: |
                    The role granted to the token.
                    Exactly one role is assigned, and the Support role can't be assigned to a token.
                expiry_date:
                  type: string
                  format: date-time
                  description: |
                    Expiry date in ISO 8601 format, either `2027-08-21T10:00:00.000Z` or `2027-08-21 10:00:00`.
                    A value carrying no time zone is read as UTC.
                    Must be at least one day in the future and at most 10 years in the future.
                ip_restrictions:
                  type: array
                  items:
                    type: string
                  description: >-
                    IP addresses the token may connect from. Each entry is an IPv4 address, optionally in CIDR notation.
                    Omit to allow any address.
              required:
                - name
                - roles
                - expiry_date
      security:
        - bearerAuth: []
