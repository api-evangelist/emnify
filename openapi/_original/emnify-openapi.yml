  /api/v1/organisation/{org_id}/tariff:
    patch:
      operationId: organization_UpdateOrganisationTariff
      summary: Update assigned tariff
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.Tariff` + `Update`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        Allows an organisation to change their assigned tariff.


        The following restrictions apply:

        * The organisation must not have more than one tariff assigned.

        * The tariff can be changed only for the own organisation and direct child organisations. The organisation
        status must be "ACTIVE".

        * If performing the change in self-service, the organisation needs to be in evaluation. Parent organisations are
        allowed to change the tariffs of production organisations.

        * The selected tariff must be active, visible to the requested organisation and must have the same currency.
        Parent organisations are allowed to assign private tariffs to their child organisations.


        In addition to updating the assigned tariff, the system will also:

        * Update all of the organisations tariff profiles to use the new tariff.

        * Activate all ratezones in the tariff in order to ensure that the endpoints do not lose connection.

        * Expire all currently active inclusive volumes and custom rates and delete future ones.
      tags:
        - organization
      parameters:
        - name: org_id
          in: path
          description: Numerical ID of an organization
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response to a successful GET, also used for a POST if it does not result in a creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization_UpdateOrganisationTariff_Response_200'
        '400':
          description: The request is malformed, e.g. the body cannot be parsed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
