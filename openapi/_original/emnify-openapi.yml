        '400':
          description: |
            The request is malformed.

            Common causes:

            - Invalid filter expression syntax in `q`
            - Invalid value for a filter or sort field
            - Datetime not in ISO-8601 format
            - Requested window exceeds the 30-day maximum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointFlowLogsDetailRequestBadRequestError'
        '401':
          description: No token given.
          content:
            application/json:
              schema:
