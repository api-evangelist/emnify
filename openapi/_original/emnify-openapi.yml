  /api/v1/endpoint/{endpoint_id}/quota/sms:
    get:
      operationId: endpoint_EndpointQuotaSmsByEndpointIdGet
      summary: Show SMS quota details
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Quota.Sms` + `Get`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge> <Badge intent="info">Observer</Badge></div>
        </Info>


        Returns details about the assigned SMS Quota for an endpoint.


        You can retrieve the current SMS quota status for an endpoint with the following API call. It will return
        following properties:

        * `status`: this indicates the status of the quota and may contain the following values:
          - `ACTIVE`: the endpoint has quota left and can use SMS services
          - `EXHAUSTED`: the endpoint has exceeded the quota volume; the endpoint is denied from using SMS services (until new quota is added)
          - `EXPIRED`: the quota has expired; the endpoint is denied from using SMS services (until new quota is added)
        * `volume`: the amount of SMS left on this quota

        * `expiry_date`: timestamp when this quota will expire and the endpoint will definitely be denied from using
        further SMS services (regardless if the quota volume was used up or not)

        * `threshold_percentage`: optional threshold in percentage indicating when a "Threshold Reached" event shall be
        sent.

        * `action_on_exhaustion`: returns the behaviour defined to be applied when quota volume is used up (exhausted).
            - `Throttle`: bandwidth will be throttle to the defined peak throughput until quota expires
            - `Block`: data service will be instantly blocked once volume used up, regardless if the expiry date is already reached or not
            - `auto_refill`: 0 (false) / 1 (true), refill the quota with the last added volume on a daily basis
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaSmsByEndpointIdGetRequestForbiddenError'
      security:
        - bearerAuth: []
    post:
      operationId: endpoint_EndpointQuotaSmsByEndpointIdPost
      summary: Set SMS quota
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Quota.Sms` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>


        At any time, a new SMS quota can be set for an endpoint.

        At an initial state when no SMS quota is set, the endpoint will be denied from using SMS services.

        To top-up the SMS volume one need to retrieve the currently left volume, increase it by the top-up volume and
        set it as the new quota volume.


        The following parameters can be configured:

        * `status` - The status of the quota (mandatory):
          - 1: `ACTIVE`
          - 2: `EXHAUSTED`
          - 3: `EXPIRED`
        * `volume`: The volume left on this quota in MB

        * `expiry_date`: Timestamp when this quota will expire and the endpoint will definitely be denied from using
        further data services (mandatory)

        * `auto_refill`: Wether the quota shall be refilled on a daily basis (defaults to disabled):
          - 0: `disabled`
          - 1: `enabled`
        * `threshold_percentage`: The percentage of remaining quota at which the system should generate a `threshold
        reached` event

        * `action_on_exhaustion`: The behaviour of the system after the quota is exhausted:
          - id: ID of the action on quota exhaustion (mandatory)
            - 1: `Block`
            - 2: `Throttle` (will not take any effect on SMS quota)
          - `peak_throughput`: The maximum bandwidth in octets per second after the endpoint has been throttled.
          Allowed values are 64000, 128000, 256000, 384000. (will not take any effect on SMS quota)

        <Note>
          The endpoint can instantly use the SMS service after the API call is successfully made.
          Any timestamp with a future date can be set, this allows to create SMS packages (e.g. for 1 hour, 24 hour, 7 days or any other timeframe) as required.
        </Note>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointQuotaSmsByEndpointIdPost_Response_201'
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaSmsByEndpointIdPostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volume:
                  type: number
                  format: double
                expiry_date:
                  type: string
                  format: date-time
                last_volume_added:
                  type: number
                  format: double
                last_status_change_date:
                  type:
                    - string
                    - 'null'
                  format: date-time
                auto_refill:
                  type: boolean
                threshold_percentage:
                  type: number
                  format: double
                threshold_volume:
                  type: number
                  format: double
                status:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdQuotaSmsPostRequestBodyContentApplicationJsonSchemaStatus
                action_on_exhaustion:
                  $ref: >-
                    #/components/schemas/ApiV1EndpointEndpointIdQuotaSmsPostRequestBodyContentApplicationJsonSchemaActionOnExhaustion
              required:
                - volume
                - expiry_date
                - threshold_percentage
                - status
      security:
        - bearerAuth: []
    delete:
      operationId: endpoint_DeleteEndpointSmsQuotaById
      summary: Remove SMS quota
      description: |
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Endpoint.Quota.Sms` + `Delete`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge> <Badge intent="info">User</Badge></div>
        </Info>

        Will delete the SMS quota for the endpoint, if any is set.

        <Info>
          If `apply_sms_quota` is still set in the service profile, the endpoint is blocked from sending SMS.
        </Info>
      tags:
        - endpoint
      parameters:
        - name: endpoint_id
          in: path
          description: Numeric ID of an endpoint
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: |
            Your role doesn't include the permission this endpoint requires.

            Most endpoints return `error_code`, `error_token`, and `message`.
            Some return only `status_code` and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEndpointSmsQuotaByIdRequestForbiddenError'
        '404':
          description: |
            Can be one of the following reasons:
