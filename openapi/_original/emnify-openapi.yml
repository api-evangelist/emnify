      security:
        - bearerAuth: []
    post:
      operationId: permissionAndRoleManagement_createCustomRole
      summary: Create a custom role
      description: >
        <Info icon="fa-light fa-lock" className="permission-callout">
          <div className="permission-callout__header"><span className="permission-callout__title"><span className="permission-callout__label">Required permissions</span> <span className="fern-docs-badge small blue subtle rounded-full permission-callout__beta">Beta</span></span> <span className="permission-callout__learn-more">[Learn more](/developers/api-guidelines/permissions#how-permissions-work)</span></div>

          `Organisation.Role` + `Create`

          <div className="permission-callout__roles"><span className="permission-callout__roles-label">Roles:</span> <Badge intent="info">Administrator</Badge></div>
        </Info>


        Creates a custom role in the Workspace.

        A Workspace can hold at most 50 custom roles, and the name must be unique within the Workspace.


        Supply permissions either as `permission_ids`, using numeric IDs, or as `permissions`, using resource and action
        pairs, but not both.

        Retrieve the valid permissions with `GET /api/v1/organisation/{orgId}/permission`.


        Use `my` in place of a numeric `orgId` to target the caller's own Workspace.
      tags:
        - permissionAndRoleManagement
      parameters:
        - name: orgId
          in: path
          description: |
            Workspace identifier.
            Either a positive integer organization ID, or the literal string `my` to target the caller's own Workspace.
          required: true
          schema:
            $ref: '#/components/schemas/ApiV1OrganisationOrgIdRolePostParametersOrgId'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithPermissionsOutputDto'
        '400':
          description: >
            Validation error.

            For example, an invalid name or description, or a referenced permission that isn't available to the
            Workspace's organization type.

            Supplying both `permission_ids` and `permissions` in the same request is also rejected, because the two
            fields are mutually exclusive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomRoleRequestBadRequestError'
        '403':
          description: >
            Custom role creation isn't available for the organization, or the user doesn't have the required
            permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomRoleRequestForbiddenError'
        '409':
          description: A role with this name already exists in the Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomRoleRequestConflictError'
        '422':
          description: >
            Business rule violation.

            For example, the limit of 50 custom roles is reached, or `permission_ids` or `permissions` references a
            permission that is unknown, deprecated, deleted, or granted globally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomRoleRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleInputDto'
      security:
        - bearerAuth: []
