    delete:
      operationId: serviceProfiles_DeleteServiceProfileTrafficLimit
      summary: Delete a data limit from a service profile
      description: 'Required permissions Beta Learn more


        `ServiceProfile.TrafficLimit` + `Delete` +1 endpoint


        Roles: Administrator User


        Deletes one data limit from a service profile.'
      tags:
