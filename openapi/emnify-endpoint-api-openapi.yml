  /api/v1/endpoint/{endpoint_id}/stats/daily:
    get:
      operationId: endpoint_EndpointStatsDailyByIdGet
      summary: Retrieve daily usage statistics for an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint.Stats` + `Get` +1 endpoint


        Roles: Administrator User Observer


        Returns daily usage statistics for a specific endpoint, including cellular data and SMS volumes.


        By default, returns statistics for the current month.

        Use `start_date` and `end_date` query parameters to specify a custom date range.


        Historical data is available for up to **13 months**.


        Data traffic cost statistics (`cost` field in the `data` object) have been deprecated.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      - name: start_date
        in: query
        description: "Filters by start date, provided in a `YYYY-MM-DD` format.\n\n<Info>\n  If you don't define an end date, the response will include 6 months of data, beginning on the current date.\n</Info>\n"
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: "Filters by end date, provided in an `YYYY-MM-DD` format.\n\n<Info>\n  If you don't define a start date, the response will only return data from the month indicated in your end date.\n</Info>\n"
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 'Successfully returned the daily endpoint statistics.


            Each day''s entry contains:


            - `date`: The date in YYYY-MM-DD format

            - `data`: Cellular data usage (volume in MB)

            - `sms`: SMS usage (volume as message count)


            Volume fields include `volume` (total), `volume_tx` (transmitted), and `volume_rx` (received).

            '
          content:
