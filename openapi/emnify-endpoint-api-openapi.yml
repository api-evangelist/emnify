  /api/v1/endpoint/{endpoint_id}/quota/data:
    get:
      operationId: endpoint_EndpointQuotaDataByEndpointIdGet
      summary: Retrieve data quota details
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Data` + `Get`


        Roles: Administrator User Observer


        Returns details about the assigned Data Quota for an endpoint.

        * `status`: this indicates the current status of the quota and may contain the following values:

        - `ACTIVE`: the endpoint can currently connect and has quota left

        - `EXHAUSTED`: the endpoint has exceeded the quota volume, if it still can use data service depends on the action chosen to be performed on exhaustion

        - `EXPIRED`: the quota has expired; the endpoint is denied from using data services (until new quota is added)

        * `volume`: returns the volume left on this quota in MB

        * `expiry_date`: timestamp when this quota will expire and the endpoint will definitely be denied from using further data services (regardless if the quota volume was used up or not)

        * `action_on_exhaustion`: returns the behaviour defined to be applied when quota volume is used up (exhausted).

        - `Throttle`: bandwidth will be throttle to the defined peak throughput until quota expires

        - `Block`: data service will be instantly blocked once volume used up, regardless if the expiry date is already reached or not

        * `auto_refill`: 0 (false) / 1 (true), refill the quota with the last added volume on a daily basis'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointQuotaDataByEndpointIdGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaDataByEndpointIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: endpoint_EndpointQuotaDataByEndpointIdPost
      summary: Set data quota
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Data` + `Create`


        Roles: Administrator User


        Set a new data quota.

        You can set a new data quota for a device at any time.

        At an initial state, when no data quota is set, the device is denied from using data services.

        To top-up the data volume, you need to retrieve the remaining volume, increase it by the top-up volume, and set it as the new quota volume.


        We have deprecated throttling as an action on quota exhaustion and the associated peak throughput parameter.

        These were decommissioned as of December 9, 2024.**


        The following parameters can be configured:

        * `status` (required) - The status of the quota:

        - 1: `ACTIVE`

        - 2: `EXHAUSTED`

        - 3: `EXPIRED`

        * `volume` - Remaining quota volume in MB

        * `expiry_date` (required) - Timestamp when the quota expires and the device is denied from using further data services

        * `auto_refill` (default: `0`) - Whether the quota should be refilled on a daily basis:

        - `0`: Disabled

        - `1`: Enabled

        * `threshold_percentage` - The remaining quota percentage when the system generates a "Quota threshold reached" event

        * `action_on_exhaustion`: Action executed after the quota is exhausted:

        - `id` (required) - Unique identifer of the action on quota exhaustion

        - `1`: Block

        - **DEPRECATED** `2`: Throttle


        **Events**:

        The system generates a "Quota used up" event if the data quota is completely depleted.

        Then, the device is blocked from further consumption of data.

        The quota object is included in the event details.


        The device can instantly use data services after successfully making this API call.

        You can set any timestamp with a future date.

        This allows you to create data packages as required (for example, 1 hour, 24 hours, 7 days, or any other timeframe).'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointQuotaDataByEndpointIdPost_Response_201'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaDataByEndpointIdPostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                last_volume_added:
                  type: string
                  title: float
                last_status_change_date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
                auto_refill:
                  type: integer
                threshold_volume:
                  type: string
                  title: float
                threshold_percentage:
                  type: string
                  title: float
                status:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdQuotaDataPostRequestBodyContentApplicationJsonSchemaStatus'
                volume:
                  type: string
                  title: float
                expiry_date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
                action_on_exhaustion:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdQuotaDataPostRequestBodyContentApplicationJsonSchemaActionOnExhaustion'
              required:
              - status
              - volume
              - expiry_date
              - action_on_exhaustion
      security:
      - bearerAuth: []
    delete:
      operationId: endpoint_DeleteEndpointDataQuotaById
      summary: Remove data quota
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Data` + `Delete`


        Roles: Administrator User


        Will delete the data quota for the endpoint, if any is set.


        If `apply_data_quota` is still set in the service profile, the endpoint will get blocked from data service.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEndpointDataQuotaByIdRequestForbiddenError'
        '404':
          description: 'Can be one of the following reasons:

            - No Data Quota configured

            - Endpoint not found

            - Endpoint not part of this organisation

            '
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/quota/sms:
    get:
      operationId: endpoint_EndpointQuotaSmsByEndpointIdGet
      summary: Show SMS quota details
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Sms` + `Get`


        Roles: Administrator User Observer


        Returns details about the assigned SMS Quota for an endpoint.


        You can retrieve the current SMS quota status for an endpoint with the following API call. It will return following properties:

        * `status`: this indicates the status of the quota and may contain the following values:

        - `ACTIVE`: the endpoint has quota left and can use SMS services

        - `EXHAUSTED`: the endpoint has exceeded the quota volume; the endpoint is denied from using SMS services (until new quota is added)

        - `EXPIRED`: the quota has expired; the endpoint is denied from using SMS services (until new quota is added)

        * `volume`: the amount of SMS left on this quota

        * `expiry_date`: timestamp when this quota will expire and the endpoint will definitely be denied from using further SMS services (regardless if the quota volume was used up or not)

        * `threshold_percentage`: optional threshold in percentage indicating when a "Threshold Reached" event shall be sent.

        * `action_on_exhaustion`: returns the behaviour defined to be applied when quota volume is used up (exhausted).

        - `Throttle`: bandwidth will be throttle to the defined peak throughput until quota expires

        - `Block`: data service will be instantly blocked once volume used up, regardless if the expiry date is already reached or not

        - `auto_refill`: 0 (false) / 1 (true), refill the quota with the last added volume on a daily basis'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaSmsByEndpointIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: endpoint_EndpointQuotaSmsByEndpointIdPost
      summary: Set SMS quota
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Sms` + `Create`


        Roles: Administrator User


        At any time, a new SMS quota can be set for an endpoint.

        At an initial state when no SMS quota is set, the endpoint will be denied from using SMS services.

        To top-up the SMS volume one need to retrieve the currently left volume, increase it by the top-up volume and set it as the new quota volume.


        The following parameters can be configured:

        * `status` - The status of the quota (mandatory):

        - 1: `ACTIVE`

        - 2: `EXHAUSTED`

        - 3: `EXPIRED`

        * `volume`: The volume left on this quota in MB

        * `expiry_date`: Timestamp when this quota will expire and the endpoint will definitely be denied from using further data services (mandatory)

        * `auto_refill`: Wether the quota shall be refilled on a daily basis (defaults to disabled):

        - 0: `disabled`

        - 1: `enabled`

        * `threshold_percentage`: The percentage of remaining quota at which the system should generate a `threshold reached` event

        * `action_on_exhaustion`: The behaviour of the system after the quota is exhausted:

        - id: ID of the action on quota exhaustion (mandatory)

        - 1: `Block`

        - 2: `Throttle` (will not take any effect on SMS quota)

        - `peak_throughput`: The maximum bandwidth in octets per second after the endpoint has been throttled.

        Allowed values are 64000, 128000, 256000, 384000. (will not take any effect on SMS quota)


        The endpoint can instantly use the SMS service after the API call is successfully made.

        Any timestamp with a future date can be set, this allows to create SMS packages (e.g. for 1 hour, 24 hour, 7 days or any other timeframe) as required.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointQuotaSmsByEndpointIdPost_Response_201'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQuotaSmsByEndpointIdPostRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volume:
                  type: number
                  format: double
                expiry_date:
                  type: string
                  format: date-time
                last_volume_added:
                  type: number
                  format: double
                last_status_change_date:
                  type:
                  - string
                  - 'null'
                  format: date-time
                auto_refill:
                  type: boolean
                threshold_percentage:
                  type: number
                  format: double
                threshold_volume:
                  type: number
                  format: double
                status:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdQuotaSmsPostRequestBodyContentApplicationJsonSchemaStatus'
                action_on_exhaustion:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdQuotaSmsPostRequestBodyContentApplicationJsonSchemaActionOnExhaustion'
              required:
              - volume
              - expiry_date
              - threshold_percentage
              - status
      security:
      - bearerAuth: []
    delete:
      operationId: endpoint_DeleteEndpointSmsQuotaById
      summary: Remove SMS quota
      description: 'Required permissions Beta Learn more


        `Endpoint.Quota.Sms` + `Delete`


        Roles: Administrator User


        Will delete the SMS quota for the endpoint, if any is set.


        If `apply_sms_quota` is still set in the service profile, the endpoint is blocked from sending SMS.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEndpointSmsQuotaByIdRequestForbiddenError'
        '404':
          description: 'Can be one of the following reasons:

            - No SMS Quota configured

            - Endpoint not found

            - Endpoint not part of this organisation

            '
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
