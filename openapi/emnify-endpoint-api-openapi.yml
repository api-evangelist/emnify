openapi: 3.2.0
info:
  title: Enterprise Endpoint API
  version: 1.0.0
  description: API endpoints for enterprise resources
servers:
- url: https://cdn.emnify.net
  description: emnify REST API
tags:
- name: Endpoint
  description: API endpoints for enterprise resources
paths:
  /api/v1/endpoint:
    get:
      operationId: endpoint_GetEndpoints
      summary: List endpoints
      description: 'Required permissions Beta Learn more


        `Endpoint` + `List`


        Roles: Administrator User Observer


        Retrieves all endpoints for your organization.

        Use the query parameters to filter, sort, and paginate results.'
      tags:
      - Endpoint
      parameters:
      - name: q
        in: query
        description: 'Filters endpoints by field value.

          Use `<field>:<criteria>` format.

          Combine multiple filters with commas (for example, `status:0,tags:sensor`).


          `connectivity_status` accepts only the value `BLOCKED`, which returns the endpoints that are currently denied service (for example, after exceeding a traffic limit).

          It takes a single value, so wildcards and `||` lists aren''t supported.

          '
        required: false
        schema:
          type: string
          pattern: (status|service_profile|tariff_profile|id|name|created|last_updated|tags|ip_address|imei|iccid|iccid_with_luhn|eid|sim_status|connectivity_status):.+
      - name: sort
        in: query
        description: 'Sorts endpoints by field value.

          Use `<operator><field>` format.

          Combine multiple sort fields with commas (for example, `-status,id`).


          **Operators:**

          - `-` descending (Z-A for text, highest number first)

          - `+` ascending (A-Z for text, lowest number first)


          Defaults to ascending order if no operator is specified.

          Defaults to `id` if no sort field is specified.

          Endpoints with identical values are sorted by ascending `id`.

          '
        required: false
        schema:
          type: string
          pattern: (^-?(id|name|status|last_updated|created|tags|ip_address|imei|eid|service_profile|tariff_profile)),?
      - name: page
        in: query
        description: 'Page number to retrieve.

          Starts at 1.

          '
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of endpoints to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      responses:
        '200':
          description: 'Returns an array of endpoint objects.

            Pagination metadata is included in the response headers.

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEndpointsRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: endpoint_CreateEndpoint
      summary: Create an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Create` +1 endpoint


        Roles: Administrator User


        Creates a single endpoint with the specified configuration.


        For bulk operations, use `POST /api/v2/endpoint/multi` instead (supports up to 2,000 endpoints per request).


        emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.'
      tags:
      - Endpoint
      responses:
        '201':
          description: Endpoint created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_CreateEndpoint_Response_201'
        '400':
          description: 'Request body is malformed.

            Check JSON syntax.

            '
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEndpointRequestForbiddenError'
        '404':
          description: 'IP address space is full, in use for creating another endpoint or the resource wasn''t found.

            '
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Validation failed.

            Possible causes:


            - Invalid service profile, tariff profile, or status ID

            - Invalid IP address space or organization ID

            - Endpoint data is invalid

            - Organization doesn''t belong to your reseller

            - Both `tags` and `tag_assignments` were provided

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the endpoint.
                tags:
                  type: string
                  description: "Comma-separated list of tags (for example, `sensor,outdoor`).\nTags that do not exist yet are created.\n\n<Warning>\n  Deprecated. Use `tag_assignments` instead.\n</Warning>\n"
                  deprecated: true
                tag_assignments:
                  type: array
                  items:
                    type: integer
                  description: "IDs of existing tags to assign to the endpoint.\nUnlike `tags`, tags are not created automatically, so every ID must already exist.\n\n<Info>\n  Mutually exclusive with `tags`. Provide at most one of the two.\n</Info>\n"
                imei:
                  type: string
                  description: International Mobile Equipment Identity with Software Version Number (IMEISV) (16 digits).
                imei_lock:
                  type: boolean
                  default: false
                  description: If `true`, this endpoint only allows connections from the device with the specified IMEI.
                sim:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaSim'
                  description: 'SIM card to assign to this endpoint.

                    If omitted, no SIM is assigned.

                    '
                ip_address:
                  type: string
                  description: "Private IP address to assign.\n\n<Info>\n  If provided, you must also specify `ip_address_space`.\n</Info>\n"
                service_profile:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaServiceProfile'
                  description: 'Service profile that determines network access settings.

                    Must belong to your organization.

                    '
                tariff_profile:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaTariffProfile'
                  description: 'Tariff profile that determines pricing and data limits.

                    Must belong to your organization.

                    '
                status:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: Initial endpoint status.
                organisation:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaOrganisation'
                  description: 'Organization to create the endpoint in.

                    Required only for reseller accounts creating endpoints in sub-organizations.

                    '
                ip_address_space:
                  $ref: '#/components/schemas/ApiV1EndpointPostRequestBodyContentApplicationJsonSchemaIpAddressSpace'
                  description: "IP address space for the endpoint.\n\n<Info>\n  Required if `ip_address` is provided.\n</Info>\n"
              required:
              - service_profile
              - tariff_profile
              - status
      security:
      - bearerAuth: []
  /api/v2/endpoint/multi:
    post:
      operationId: endpoint_BulkCreateEndpoint
      summary: Bulk create endpoints
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Create` +1 endpoint


        Roles: Administrator User


        Create up to 2,000 endpoints in one request.


        Unlike `POST /api/v1/endpoint`, this bulk endpoint handles multiple endpoints safely in a single request without sequential execution constraints between individual endpoints.


        Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.


        If a `sim` object is provided, the specified SIM is assigned to the endpoint and is activated by default.

        To assign the SIM without activating it, explicitly set the `activate` property to `false`; omitting it activates the SIM.


        When the SIM is activated:

        - The SIM enters Factory Test Mode (FTM) if FTM is enabled for the organization.

        - Otherwise, it goes directly to **Activated**.


        To override this behavior and explicitly set the SIM''s status (for example, skip FTM even if it''s enabled for your organization), include a `status` object within the `sim` object.


        emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.'
      tags:
      - Endpoint
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostResponsesContentApplicationJsonSchemaItems'
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'User doesn''t have permission to bulk create endpoints

            '
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: IP address space is full
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Appears in one of the following cases:


            - Service profile is invalid

            - Tariff profile is invalid

            - Status is invalid

            - IP address space is invalid

            - Organization is invalid

            - Endpoints are invalid

            - Both `tags` and `tag_assignments` were provided for an endpoint

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_profile:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaServiceProfile'
                  description: 'Applies to all endpoints.

                    '
                tariff_profile:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaTariffProfile'
                  description: 'Applies to all endpoints.

                    '
                status:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: 'Applies to all endpoints.

                    '
                organisation:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaOrganisation'
                  description: 'If provided, it must include a valid `id` (cannot be empty).

                    '
                ip_address_space:
                  $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaIpAddressSpace'
                  description: 'Required if any endpoint in the `endpoints` array has an `ip_address`.

                    '
                endpoints:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2EndpointMultiPostRequestBodyContentApplicationJsonSchemaEndpointsItems'
              required:
              - service_profile
              - tariff_profile
              - status
              - endpoints
      security:
      - bearerAuth: []
    delete:
      operationId: endpoint_BulkDeleteEndpoint
      summary: Bulk delete endpoints
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Delete` +1 endpoint


        Roles: Administrator User


        Deletes a list of endpoints in bulk, along with all child entities.


        Unlike `DELETE /api/v1/endpoint/{endpoint_id}`, this bulk endpoint handles multiple endpoints safely in a single request without sequential execution constraints between individual endpoints.


        Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.


        If a SIM is assigned to one of the endpoints, it''s released and suspended.

        If the `delete_sims` query parameter is set to `true`, the SIMs are also deleted.'
      tags:
      - Endpoint
      parameters:
      - name: delete_sims
        in: query
        description: 'If `true`, the SIMs will be deleted along with the endpoints.

          If `false`, the SIMs will only be suspended.

          Defaults to `false`.

          '
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: Endpoints deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'User doesn''t have permission to bulk delete endpoints

            '
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: 'Requested endpoint ID isn''t found

            '
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV2EndpointMultiDeleteRequestBodyContentApplicationJsonSchemaItems'
      security:
      - bearerAuth: []
    patch:
      operationId: endpoint_BulkUpdateEndpoint
      summary: Bulk update endpoints
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Update` +1 endpoint


        Roles: Administrator User


        Updates details of a list of endpoints in bulk.


        The request body must be an array of endpoint objects.

        Each object requires an `id` field to identify the endpoint, and you only need to include the fields you want to update.


        Unlike `PATCH /api/v1/endpoint/{endpoint_id}`, this bulk endpoint handles multiple endpoints safely in a single request without sequential execution constraints between individual endpoints.


        Execute bulk operations sequentially - wait for each bulk request to complete before starting the next.


        emnify charges for activated SIMs, even if the endpoint status is set to **Disabled**.

        To avoid accruing unexpected charges, update the SIM status to **Suspended** (`"id": 2`).'
      tags:
      - Endpoint
      responses:
        '204':
          description: Endpoints updated successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'User doesn''t have permission to bulk update endpoints

            '
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: 'Appears in one of the following cases:


            - IP address space isn''t found

            - IP address space is full

            '
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Appears in one of the following cases:


            - Service profile is invalid

            - Tariff profile is invalid

            - Status is invalid

            - IP address space is invalid

            - IP address is invalid

            - SIM is invalid

            - Both `tags` and `tag_assignments` were provided

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiV2EndpointMultiPatchRequestBodyContentApplicationJsonSchemaItems'
      security:
      - bearerAuth: []
  /api/v1/endpoint/status:
    get:
      operationId: endpoint_EndpointStatusGet
      summary: List endpoint statuses
      description: 'Required permissions Beta Learn more


        `Endpoint.Status` + `List`


        Roles: Administrator User Observer


        Returns a list of available endpoint statuses.'
      tags:
      - Endpoint
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointStatusGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatusGetRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}:
    get:
      operationId: endpoint_EndpointByIdGet
      summary: Endpoint details
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Get`


        Roles: Administrator User Observer


        Retrieves endpoint details for a given ID.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successfully returned the endpoint details associated with the provided `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointByIdGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointByIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
    delete:
      operationId: endpoint_EndpointByIdDelete
      summary: Delete an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Delete` +1 endpoint


        Roles: Administrator User


        Deletes an endpoint and all its child entities.


        Execute this operation sequentially - wait for each request to complete before starting the next.


        For bulk deletions, use `DELETE /api/v2/endpoint/multi` instead (supports up to 2,000 endpoints).


        Endpoints with an assigned SIM cannot be deleted (results in a `409` error).'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: 'Endpoints deleted successfully.

            The response payload body should be empty.

            '
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: 'Request body is malformed

            '
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointByIdDeleteRequestForbiddenError'
        '404':
          description: 'Requested endpoint ID wasn''t found

            '
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: 'Requested endpoint is still referenced (for example, there is an assigned SIM)

            '
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    patch:
      operationId: endpoint_EndpointByIdPatch
      summary: Update an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint` + `Update` +1 endpoint


        Roles: Administrator User


        Updates the details of an endpoint.


        Execute this operation sequentially - wait for each request to complete before starting the next.


        For bulk updates, use `PATCH /api/v2/endpoint/multi` instead (supports up to 2,000 endpoints).


        emnify charges for activated SIMs, even if the endpoint `status` is set to **Disabled**.

        To avoid accruing unexpected charges, update the SIM `status` to **Suspended** (`"id": 2`).'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Endpoint updated successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Request body is malformed
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'User doesn''t have permission to bulk update endpoints

            '
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: 'Appears in one of the following cases:


            - IP address space isn''t found

            - IP address space is full

            '
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Appears in one of the following cases:


            - Service profile is invalid

            - Tariff profile is invalid

            - Status is invalid

            - IP address space is invalid

            - IP address is invalid

            - SIM is invalid

            - Both `tags` and `tag_assignments` were provided

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointByIdPatchRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service_profile:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaServiceProfile'
                tariff_profile:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaTariffProfile'
                status:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaStatus'
                ip_address_space:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaIpAddressSpace'
                sim:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdPatchRequestBodyContentApplicationJsonSchemaSim'
                name:
                  type: string
                tags:
                  type:
                  - string
                  - 'null'
                  description: "Comma-separated tag names replacing the tags currently assigned to the endpoint.\nTags that don't exist yet are created, an empty string removes all tags.\nSending `null` leaves the current tags unchanged, the same as omitting the field.\n\n<Warning>\n  Deprecated. Use `tag_assignments` instead.\n</Warning>\n"
                  deprecated: true
                tag_assignments:
                  type: array
                  items:
                    type: integer
                  description: "IDs of existing tags replacing the tags currently assigned to the endpoint.\nAn empty array removes all tags.\n\n<Info>\n  Mutually exclusive with `tags`. Provide at most one of the two.\n</Info>\n"
                imei:
                  type: string
                imei_lock:
                  type: boolean
                ip_address:
                  type: string
              required:
              - service_profile
              - tariff_profile
              - status
              - ip_address_space
              - sim
              - name
              - imei
              - imei_lock
              - ip_address
      security:
      - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/connectivity:
    get:
      operationId: endpoint_EndpointConnectivityByIdGet
      summary: Endpoint connectivity status
      description: 'Required permissions Beta Learn more


        `Endpoint.Connectivity` + `Get` +1 endpoint


        Roles: Administrator User Observer


        Retrieve details about current connectivity status of endpoint.

        The following is a list of possible statuses:


        * `ATTACHED`:

        The Endpoint has succesfully attached to the Home Core network in the past.

        The device will be shown as `ATTACHED` until the visited network has signaled that the device is inactive/offline.

        Usually the visited network informs the Core Network within 1-2 days after a device went offline.


        * `ONLINE`:

        The Endpoint has an active data connection


        * `OFFLINE`:

        The Endpoint has not attached to the core network yet or the device was previously attached but the visited network signaled that the device had no activity for the last 1-2 days.

        Note: The device is not reachable for external services (e.g. SMS, MSRN lookup).


        * `BLOCKED`:

        The device is not granted service. Endpoints are assigned this status when they have exceeded traffic limits.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint_EndpointConnectivityByIdGet_Response_200'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointConnectivityByIdGetRequestForbiddenError'
      security:
      - bearerAuth: []
    patch:
      operationId: endpoint_UpdateEndpointConnectivityById
      summary: Reset endpoint connectivity
      description: 'Required permissions Beta Learn more


        `Endpoint.Connectivity` + `Update`


        Roles: Administrator User


        Dispatches a message that causes either a `Cancel Location`, `Delete PDP Context`, or both sent to the endpoint.

        The return of the call doesn''t yet mean the event has been sent towards the device.


        Master organization types can reset any endpoints inside their organization hierarchy.

        Enterprises may only reset connectivity of own endpoints.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful, no content.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: Calling organization is not of correct type.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Endpoint not found.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pdp_context:
                  oneOf:
                  - description: Any type
                  - type: 'null'
                location:
                  oneOf:
                  - description: Any type
                  - type: 'null'
      security:
      - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/event:
    get:
      operationId: endpoint_EndpointEventsByID
      summary: List endpoint events
      description: 'Required permissions Beta Learn more


        `Endpoint.Event` + `List`


        Roles: Administrator User Observer


        Returns the list of events, filtered, sorted and paged according to query parameters.


        A full list of events is found in section "Retrieve Event Types" (`/api/v1/event/type`).


        This API endpoint deviates from the specified conventions and may not return the same HTTP Codes as the higher layer call (`/api/v1/endpoint/{endpoint_id}`).

        In case the requested `{endpoint_id}` doesn''t exist or is not accessible for the user, **HTTP 200** will be returned with empty **[]** as long as the provided `{endpoint_id}` is a number and all parameters are valid.


        Please take that into consideration when building automation on top of the error behaviour of this endpoint.'
      tags:
      - Endpoint
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Current page number
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Defines the number of items per page
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: 'Sort properties according to a comma separated list of accepted fields. Valid fields are:


          * `id` - (**event id**)

          * `timestamp` - (**event timestamp**)

          * `source` - (**event source**)

          * `severity` - (**event severity**)

          * `alert` - (**alert status**)

          * `organisation` - (**organisation name**)

          * `user` - (**user id**)

          * `endpoint` - (**endpoint name**)

          * `tags` - (**endpoint tags**)

          * `ip_address` - (**endpoint ip_address**)

          * `iccid` - (**sim iccid**)

          * `imsi` - (**sim imsi**)

          * `type` - (**event type**)

          '
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: 'Filter parameter in `<filter>:<value>` format.

          Multiple filters must be a comma-separated list of the following fields:


          * `from` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, **only valid with until**)

          * `until` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, **only valid with from**)

          * `type` (**event_type**, numerical)

          * `source` (**event_type**, numerical, e.g. 0 = Network), 1 = Policy Control, 2 = API)

          * `severity` (**event_severity**, numerical, e.g. 0 = Info, 1 = Warn), 2 = Critical)

          * `alert` (boolean, e.g. true, false)

          * `description` (**event description**, string)

          * `organisation` (**organisation name**, string)

          * `user` (**user name**, string)

          * `endpoint` (**endpoint name**, string)

          * `tags` (**endpoint tags**, string)

          * `tag_id` (**endpoint tag ID**, numerical, matches events whose endpoint has the tag. Tag IDs are listed in the endpoint''s `tag_assignments`)

          * `ip_address` (**endpoint IP address**, valid IPv4/IPv6 address)

          * `imei` (**endpoint imei**, numerical string)

          * `iccid` (**sim iccid**, numerical string)

          * `imsi` (**sim imsi**, numerical string)

          * `timestamp` (**date**, format `YYYY-MM-DDTHH:mm:ssZ`, for querying events of 1 day, deprecated in future)

          * `iccid_with_luhn` (**sim iccid with Luhn**, numerical string)

          * `network` (**endpoint network**, string, e.g. Telekom)

          * `rat` (**event pdp context rat type**, numerical string, e.g. 6)

          * `country` (**endpoint country**, string, e.g. Germany)


          Some filters can accept up to 6 values which must be separated by the pipe symbol (`|`) or url-encoded as (`%7C`):


          * `iccid` (q: iccid:1234567890123456789|8988303000123456789)

          * `iccid_with_luhn` (q: iccid_with_luhn:12345678901234567891|89883030001234567891)

          * `endpoint` (q: endpoint:example_endpoint_name|another_endpoint_name)

          * `type` (q: type:example_event_type|another_event_type)

          * `network` (q: network:example_network|another_network)

          * `rat` (q: rat:example_rat|another_rat)

          * `country` (q: country:example_country|another_country)

          * `tag_id` (q: tag_id:7|12, matches events whose endpoint has any of the tags)

          '
        required: false
        schema:
          type: string
          pattern: (from|until|type|source|severity|alert|description|organisation|user|endpoint|tags|tag_id|ip_address|imei|iccid|iccid_with_luhn|imsi|timestamp|network|rat|country):.+
      responses:
        '200':
          description: Successfully returned a list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1EndpointEndpointIdEventGetResponsesContentApplicationJsonSchemaItems'
        '400':
          description: '**Bad Request** due to incorrect **Paging** Parameters, **Sorting** Parameter or incorrect `{endpoint_id}`

            '
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointEventsByIDRequestForbiddenError'
        '422':
          description: '**Unprocessable Entity** due to incorrect **Query** parameters

            '
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
  /api/v1/endpoint/{endpoint_id}/stats:
    get:
      operationId: endpoint_EndpointStatsByIdGet
      summary: Endpoint usage and cost statistics
      description: 'Required permissions Beta Learn more


        `Endpoint.Stats` + `Get` +1 endpoint


        Roles: Administrator User Observer


        You can only retrieve data traffic costs for organizations without multi-inclusive volumes.


        Retrieves endpoint usage and cost statistics for a given ID.

        Usage statistics are sorted by `data` and `sms`.


        Returns statistics from the following periods:


        - `last_month`: Previous billing month, from the first to last day (for example, April 1-30, 2023, when you send the request sometime in May 2023).

        - `current_month`: Current month, with statistics calculated up to and including the date requested (for example, May 1-8, 2023, when you sent the request on May 8, 2023).

        - `last_hour`: Previous 60 minutes, accumulated per minute and organized by data or SMS received by the device (`rx`) and transmitted by the device (`tx`).


        `last_month` and `current_month` are only included in the responses if traffic exists.'
      tags:
      - Endpoint
