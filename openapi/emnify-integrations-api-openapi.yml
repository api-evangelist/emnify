      tags:
      - Integrations
      responses:
        '200':
          description: Successfully retrieved a list of API Callback URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  description: Any type
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPICallbackURLsRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: integrations_CreateCallbackURL
      summary: Create a callback URL
      description: 'Required permissions Beta Learn more


        `CallbackUrl` + `Create`


        Roles: Administrator User


        Create Callback URL'
      tags:
      - Integrations
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_CreateCallbackURL_Response_201'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

