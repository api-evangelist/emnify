          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCallbackURLRequestForbiddenError'
      requestBody:
        description: Creating an API callback URL
        content:
          application/json:
            schema:
              description: Any type
      security:
      - bearerAuth: []
