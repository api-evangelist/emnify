  /api/v1/api_secret:
    get:
      operationId: integrations_GetAPICallbackSecret
      summary: List API callback secrets
      description: 'Required permissions Beta Learn more


        `CallbackSecret` + `List`


        Roles: Administrator User Observer


        Lists API callback secrets.


        The `secret` property itself is not returned in this call.'
      tags:
      - Integrations
      responses:
        '200':
          description: Successfully retrieved a list of API Callback Secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1ApiSecretGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPICallbackSecretRequestForbiddenError'
      security:
      - bearerAuth: []
    post:
      operationId: integrations_CreateCallbackSecret
      summary: Create a callback secret
      description: 'Required permissions Beta Learn more


        `CallbackSecret` + `Create`


        Roles: Administrator User


        Creates a new secret that may be used by API callbacks.


        When an `api_secret` is assigned to a Service Profile with an API callback, API requests towards this URL will contain an `Authorization` header with a JSON Web Token.

        The `api_secret` is used as the **Signing Key** of the JWT.'
      tags:
      - Integrations
      responses:
        '201':
          description: Resource Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_CreateCallbackSecret_Response_201'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCallbackSecretRequestForbiddenError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organisation_id:
                  type: string
                purpose:
                  type: string
                id:
                  type: integer
      security:
      - bearerAuth: []
  /api/v1/api_secret/{api_secret_id}:
    get:
      operationId: integrations_GetCallbackSecretbyID
      summary: Get a callback secret by ID
      description: 'Required permissions Beta Learn more


        `CallbackSecret` + `Get`


