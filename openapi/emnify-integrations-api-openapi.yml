          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    delete:
      operationId: integrations_DeleteCallbackSecret
      summary: Delete a callback secret
      description: 'Required permissions Beta Learn more


        `CallbackSecret` + `Delete`


