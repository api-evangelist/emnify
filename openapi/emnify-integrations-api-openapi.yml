        Get data stream configuration and status by ID.'
      tags:
      - Integrations
      parameters:
      - name: data_stream_id
        in: path
        description: ID of a data stream.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Single Data Stream Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_GetDataStreamerByIdV2_Response_200'
        '401':
          description: No or invalid authentication token provided
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Authentication token is valid, but user has no access permissions to the request resource
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: A non-existent resource is requested
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    delete:
      operationId: integrations_DeleteDataStreamerV2
      summary: Delete existing data stream
      description: 'Required permissions Beta Learn more


        `DataStream` + `Delete`


        Roles: Administrator User'
      tags:
      - Integrations
      parameters:
      - name: data_stream_id
        in: path
        description: ID of a data stream.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_DeleteDataStreamerV2_Response_202'
        '401':
          description: No or invalid authentication token provided
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Authentication token is valid, but user has no access permissions to the request resource
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: A non-existent resource is requested
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: The request could not be completed due to a conflict with the current state of the resource.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    patch:
      operationId: integrations_PatchV2DataStream
      summary: Modify existing data stream
      description: 'Required permissions Beta Learn more


        `DataStream` + `Update`


        Roles: Administrator User'
      tags:
      - Integrations
      parameters:
      - name: data_stream_id
        in: path
        description: ID of a data stream.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_PatchV2DataStream_Response_202'
        '401':
          description: No or invalid authentication token provided
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Authentication token is valid, but user has no access permissions to the request resource
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: A non-existent resource is requested
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Body will return list of validation errors
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        description: Description of the status
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Descriptive name or purpose of the data stream
                destination:
                  $ref: '#/components/schemas/ApiV2DataStreamDataStreamIdPatchRequestBodyContentApplicationJsonSchemaDestination'
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2DataStreamDataStreamIdPatchRequestBodyContentApplicationJsonSchemaFiltersItems'
                data_stream_type:
                  description: Any type
                relation_resolution:
                  description: Any type
                status:
                  $ref: '#/components/schemas/ApiV2DataStreamDataStreamIdPatchRequestBodyContentApplicationJsonSchemaStatus'
      security:
      - bearerAuth: []
  /api/v2/data_stream/{data_stream_id}/restart:
    post:
      operationId: integrations_DataStreamerV2ByIdRestart
      summary: Restart existing data stream
      description: 'Required permissions Beta Learn more


        `DataStream` + `Restart`


        Roles: Administrator User


        Restart your Existing Data Stream.

        This might be necessary when e.g. your Webhook endpoint has been unreachable for an extended period of time.

        Webhook Data Stream will exhaust retries and go into Error State.

        By using this API call your Data Stream will be restarted and continue trying to send data.'
      tags:
      - Integrations
      parameters:
      - name: data_stream_id
        in: path
        description: ID of a data stream.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations_DataStreamerV2ByIdRestart_Response_202'
        '401':
          description: No or invalid authentication token provided
          content:
            application/json:
              schema:
                description: Any type
        '403':
          description: Authentication token is valid, but user has no access permissions to the request resource
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: A non-existent resource is requested
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: The request could not be completed due to a conflict with the current state of the resource.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
  /api/v1/api_callback:
    get:
      operationId: integrations_GetAPICallbackURLs
      summary: Retrieve list of API callback URLs
      description: 'Required permissions Beta Learn more


        `CallbackUrl` + `List`


