paths:
  /api/v1/operator:
    get:
      operationId: operator_OperatorGet
      summary: List operators
      description: 'Required permissions Beta Learn more


        `Operator` + `List`


        Roles: Administrator User Observer


        Returns a collection of existing operators.


        It will return an array of items with following properties:


        * `id`: identifier of this operator

        * `name`: the official name of the operator

        * `name_and_country`: Name / Country (for easy access in the UI)

        * `country`: country object with the nested country `id`

        * `mnc`: Array of Mobile Network Codes (MNCs)

        * `tapcode`: Array of TAP Codes'
      tags:
      - Operator
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1OperatorGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorGetRequestForbiddenError'
      security:
      - bearerAuth: []
