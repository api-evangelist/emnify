            - No Data Quota configured

            - Endpoint not found

            - Endpoint not part of this organisation

            '
          content:
            application/json:
              schema:
                description: Any type
  /api/v1/endpoint/{endpoint_id}/quota/sms:
    get:
      operationId: endpoint-quota-sms-by-endpoint-id-get
      summary: Show SMS quota details
      description: "Returns details about the assigned SMS Quota for an endpoint.\n\nYou can retrieve the current SMS quota status for an endpoint with the following API call. It will return following properties:\n* `status`: this indicates the status of the quota and may contain the following values:\n  - `ACTIVE`: the endpoint has quota left and can use SMS services\n  - `EXHAUSTED`: the endpoint has exceeded the quota volume; the endpoint is denied from using SMS services (until new quota is added)\n  - `EXPIRED`: the quota has expired; the endpoint is denied from using SMS services (until new quota is added)\n* `volume`: the amount of SMS left on this quota\n* `expiry_date`: timestamp when this quota will expire and the endpoint will definitely be denied from using further SMS services (regardless if the quota volume was used up or not)\n* `threshold_percentage`: optional threshold in percentage indicating when a \"Threshold Reached\" event shall be sent.\n* `action_on_exhaustion`: returns the behaviour defined to be applied when quota volume is used up (exhausted).\n    - `Throttle`: bandwidth will be throttle to the defined peak throughput until quota expires\n    - `Block`: data service will be instantly blocked once volume used up, regardless if the expiry date is already reached or not\n    - `auto_refill`: 0 (false) / 1 (true), refill the quota with the last added volume on a daily basis\n"
      tags:
