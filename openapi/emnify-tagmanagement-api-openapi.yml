  /api/v2/bulk-operations/tag/delete-tags:
    post:
      operationId: tagManagement_DeleteTagsInBulk
      summary: Bulk delete tags
      description: 'Required permissions Beta Learn more


        `Tag` + `Delete` +1 endpoint


        Roles: Administrator User


        Deletes tags in bulk.'
      tags:
