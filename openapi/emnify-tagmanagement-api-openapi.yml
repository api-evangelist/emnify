openapi: 3.2.0
info:
  title: Enterprise Tag Management API
  version: 1.0.0
  description: Management of endpoint tags
servers:
- url: https://cdn.emnify.net
  description: emnify REST API
tags:
- name: tagManagement
  description: Management of endpoint tags
paths:
  /api/v2/tag-colors:
    get:
      operationId: tagManagement_ListTagColors
      summary: Returns the list of available tag colors
      description: 'Required permissions Beta Learn more


        `Tag.Color` + `List`


        Roles: Administrator User Observer


        Returns the list of available tag colors'
      tags:
      - tagManagement
      responses:
        '200':
          description: Tag colors successfully listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV2TagColorsGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagColorsRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v2/tags:
    get:
      operationId: tagManagement_ListTags
      summary: List tags
      description: 'Required permissions Beta Learn more


        `Tag` + `List`


        Roles: Administrator User Observer


        Returns a list of all registered tags within the organization.'
      tags:
      - tagManagement
      parameters:
      - name: name
        in: query
        description: The tag name
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Current page number
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Defines the number of items per page
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Tags successfully listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag_management_ListTags_Response_200'
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsRequestBadRequestError'
        '403':
          description: User doesn't have permission to list tags.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    post:
      operationId: tagManagement_CreateTag
      summary: Create a tag
      description: 'Required permissions Beta Learn more


        `Tag` + `Create`


        Roles: Administrator User


        Creates a tag with the given name and color ID.


        If no color ID is provided, a random color is assigned to the tag.'
      tags:
      - tagManagement
      responses:
        '201':
          description: Tag successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag_management_CreateTag_Response_201'
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTagRequestBadRequestError'
        '403':
          description: User doesn't have permission to create tags.
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: The tag already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTagRequestConflictError'
        '422':
          description: 'Unprocessable entity.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTagRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  $ref: '#/components/schemas/ApiV2TagsPostRequestBodyContentApplicationJsonSchemaColor'
              required:
              - name
      security:
      - bearerAuth: []
  /api/v2/tags/{tag_id}:
    delete:
      operationId: tagManagement_DeleteTag
      summary: Delete a tag
      description: 'Required permissions Beta Learn more


        `Tag` + `Delete` +1 endpoint


        Roles: Administrator User


        Deletes a tag and it removes all associations with resources (for example, devices or automations).'
      tags:
      - tagManagement
      parameters:
      - name: tag_id
        in: path
        description: The tag ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: Tag successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: User doesn't have permission to delete tags.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: The provided tag ID doesn't exist.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    patch:
      operationId: tagManagement_UpdateTag
      summary: Update a tag
      description: 'Required permissions Beta Learn more


        `Tag` + `Update`


        Roles: Administrator User


        Updates a tag with the provided name and color ID.


        Tags are organization-level resources, so the new name and color apply to every endpoint the tag is assigned to and are visible to all users in the organization.

        Tag colors aren''t a per-user setting.'
      tags:
      - tagManagement
      parameters:
      - name: tag_id
        in: path
        description: The tag ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '204':
          description: Tag successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTagRequestBadRequestError'
        '403':
          description: User doesn't have permission to update tags.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: The provided tag ID doesn't exist.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Unprocessable entity.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTagRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  $ref: '#/components/schemas/ApiV2TagsTagIdPatchRequestBodyContentApplicationJsonSchemaColor'
      security:
      - bearerAuth: []
  /api/v2/endpoint/{endpoint_id}/tags:
    get:
      operationId: tagManagement_ListEndpointTags
      summary: List endpoint tags
      description: 'Required permissions Beta Learn more


        `Endpoint.Tag` + `List`


        Roles: Administrator User Observer


        Returns a list of tags assigned to the provided endpoint.'
      tags:
      - tagManagement
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Tags successfully listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV2EndpointEndpointIdTagsGetResponsesContentApplicationJsonSchemaItems'
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEndpointTagsRequestBadRequestError'
        '403':
          description: User doesn't have permission to list endpoint tags.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - bearerAuth: []
    post:
      operationId: tagManagement_AssignTagToEndpoint
      summary: Assign a tag to an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint.Tag` + `Add` +1 endpoint


        Roles: Administrator User


        Assigns a tag to the provided endpoint.

        To successfully assign a tag, you must include the tag''s ID in the request body.'
      tags:
      - tagManagement
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Tag successfully assigned to the endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag_management_AssignTagToEndpoint_Response_201'
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTagToEndpointRequestBadRequestError'
        '403':
          description: User doesn't have permission to assign tags.
          content:
            application/json:
              schema:
                description: Any type
        '409':
          description: The tag is already assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTagToEndpointRequestConflictError'
        '422':
          description: 'Unprocessable entity.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTagToEndpointRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                  format: double
      security:
      - bearerAuth: []
  /api/v2/endpoint/{endpoint_id}/tags/{tag_id}:
    delete:
      operationId: tagManagement_UnassignEndpointTag
      summary: Unassign a tag from an endpoint
      description: 'Required permissions Beta Learn more


        `Endpoint.Tag` + `Remove` +1 endpoint


        Roles: Administrator User


        Unassigns a tag from the provided endpoint.

        To successfully unassign a tag, you must include the tag''s ID in the request body.'
      tags:
      - tagManagement
      parameters:
      - name: endpoint_id
        in: path
        description: Numeric ID of an endpoint
        required: true
        schema:
          type: integer
      - name: tag_id
        in: path
        description: The tag ID
        required: true
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Tag successfully unassigned from the endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag_management_UnassignEndpointTag_Response_200'
        '400':
          description: 'Invalid payload.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignEndpointTagRequestBadRequestError'
        '403':
          description: User doesn't have permission to unassign tags.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: The provided tag ID doesn't exist.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: 'Unprocessable entity.

            See HTTP response body for details.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignEndpointTagRequestUnprocessableEntityError'
      security:
      - bearerAuth: []
  /api/v2/bulk-operations/endpoint/add-tags:
    post:
      operationId: tagManagement_AssignTagToEndpointsInBulk
      summary: Bulk assign tags
      description: 'Required permissions Beta Learn more


        `Endpoint.Tag` + `Add` +1 endpoint


        Roles: Administrator User


