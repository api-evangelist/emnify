          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiV2BulkOperationsEndpointAddTagsPostRequestBodyContentApplicationJsonSchemaItemsItems'
      security:
      - bearerAuth: []
  /api/v2/bulk-operations/endpoint/remove-tags:
    post:
      operationId: tagManagement_UnassignTagsFromEndpointsInBulk
      summary: Bulk unassign tags
      description: 'Required permissions Beta Learn more


