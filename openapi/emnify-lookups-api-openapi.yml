  /api/v1/breakout_ip_range:
    get:
      operationId: lookups_BreakoutIpRangeGet
      summary: List public breakout IP ranges
      description: 'Required permissions Beta Learn more


        No permission required. Available to all roles.


        Returns the current public IPv4 egress ranges used for internet breakout,

        grouped by breakout region. Use these CIDR ranges to keep firewall and

        allowlist rules up to date.'
      tags:
      - lookups
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lookups_BreakoutIpRangeGet_Response_200'
        '401':
          description: Missing or invalid Authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakoutIpRangeGetRequestUnauthorizedError'
        '403':
          description: The user does not have permission to list public breakout IP ranges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakoutIpRangeGetRequestForbiddenError'
        '500':
          description: Unexpected error while checking permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakoutIpRangeGetRequestInternalServerError'
      security:
      - bearerAuth: []
  /api/v1/esme_interface_type:
