  /api/v1/rat_type:
    get:
      operationId: lookups_RatType
      summary: List RAT types
      description: 'Required permissions Beta Learn more


        `RatType` + `List`


        Roles: Administrator User Observer


        Returns a list of supported RAT types.'
      tags:
      - lookups
      parameters:
      - name: blacklistable
        in: query
        description: 'Returns a list of RAT types that can be blacklisted for network coverage data.


          `/api/v1/rat_type?blacklistable`

          '
        required: false
        schema:
          type: boolean
      - name: limitable
        in: query
        description: 'Returns a list of RAT types that can be limited for a pdp_context_definition


          `/api/v1/rat_type?limitable`

          '
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1RatTypeGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatTypeRequestForbiddenError'
      security:
      - bearerAuth: []
  /api/v1/service_level:
    get:
      operationId: lookups_ListServiceLevels
      summary: Get list of service levels
      description: 'Required permissions Beta Learn more


        No permission required. Available to all roles.


        Returns a list of service levels that can be configured on a tariff plan level.

        For non-enterprise organisations, only own service levels will be returned.

        For enterprise organisations, only the service levels of the parent organisation will be returned.'
      tags:
      - lookups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1ServiceLevelGetResponsesContentApplicationJsonSchemaItems'
      security:
      - bearerAuth: []
