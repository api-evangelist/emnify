openapi: 3.2.0
info:
  title: Enterprise Lookups API
  version: 1.0.0
  description: Lookup services for various resources
servers:
- url: https://cdn.emnify.net
  description: emnify REST API
tags:
- name: lookups
  description: Lookup services for various resources
paths:
  /api/v1/country:
    get:
      operationId: lookups_CountryGet
      summary: List country codes
      description: 'Required permissions Beta Learn more


        `Country` + `List`


        Roles: Administrator User Observer


        Provides the list of available countries (lookup).'
      tags:
      - lookups
      parameters:
      - name: geographic
        in: query
        description: 'Filters the country list for geographic countries only.

          This will exclude duplicate countries with different MCCs, like `India MCC 405` or `United States (311)`.

          '
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiV1CountryGetResponsesContentApplicationJsonSchemaItems'
        '403':
          description: 'Your role doesn''t include the permission this endpoint requires.


            Most endpoints return `error_code`, `error_token`, and `message`.

            Some return only `status_code` and `message`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryGetRequestForbiddenError'
      security:
      - bearerAuth: []
