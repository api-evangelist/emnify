          format: date-time
          description: Date and time when the published dataset was last updated.
        internet_breakout:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Public IPv4 CIDR ranges grouped by breakout region.
      required:
      - updated_at
      - internet_breakout
      title: Lookups_BreakoutIpRangeGet_Response_200
    ApiV1DataBlocksizeGetResponsesContentApplicationJsonSchemaItems:
      type: object
      properties:
        id:
          type: integer
        octets:
          type: string
        description:
          type: string
      title: ApiV1DataBlocksizeGetResponsesContentApplicationJsonSchemaItems
    BreakoutIpRangeGetRequestForbiddenError:
